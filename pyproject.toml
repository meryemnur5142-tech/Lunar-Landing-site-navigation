[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "luna-ai"
version = "0.1.0"
description = "Lunar crater exploration autonomous mission system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "pyyaml>=6.0"]
geo = ["gdal", "rasterio>=1.3", "geopandas>=0.14", "psycopg2-binary>=2.9"]
space = ["spiceypy>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["domain", "mission_intelligence", "data-platform"]
omit = ["*/test_*", "*/__pycache__/*"]
