# LUNA-AI Example Scenario — Nominal Surface Exploration
# Related: simulation/simulator_design.md §4.3
#          simulation/scenarios/operational_scenarios.md SC-001
# Document ID: LUNA-AI-SIM-SCN-001
# Version: 0.1-draft
# Date: 2026-11-14
# Owner: Agent C

scenario_id: "SCN-001-NOMINAL"
name: "Nominal Surface Exploration — 5 Waypoint Tour"
description: >
  Vehicle in NOMINAL safety state, SURFACE_EXPLORATION phase, travels sequentially
  to 5 scientific target waypoints, collects scientific data at each point, and
  returns to base camp. No faults injected. SIL regression baseline.
version: "1.0"
created: "2026-11-14"
references:
  operational_scenario: "SC-001"
  safety_state_machine: "LUNA-AI-ARCH-001"
  conops: "docs/conops/CONOPS.md"
  hard_constraints:
    - "HC-006"   # return reserve
    - "HC-001"   # slope limit
    - "HC-005"   # solar panel mandatory charge
  fault_injection: "none"

# ======================================================
# INITIAL CONDITIONS
# ======================================================
initial_conditions:

  # Vehicle position (local Cartesian — relative to DEM origin)
  position:
    x_m: 0.0
    y_m: 0.0
    z_m: 0.0            # determined by interpolation from DEM
    uncertainty_m: 0.3  # EKF initial covariance; < 0.5m QAR-NAV-002

  heading_deg: 0.0      # North direction (DEM reference)
  velocity_ms: 0.0      # Vehicle starts stationary

  # Energy
  soc_percent: 85.0     # Nominal starting SoC
  panel_orientation_deg: 0.0  # Starting orientation facing sun

  # Safety state
  safety_state: "NOMINAL"
  mission_phase: "SURFACE_EXPLORATION"

  # Thermal — all components in nominal range
  thermal:
    all_nominal: true
    battery_temp_c: 20.0    # TBD-THM-001; nominal after ground warm-up
    obc_temp_c: 25.0
    imu_temp_c: 20.0

  # Communication
  link_active: true
  link_quality_pct: 90

  # Mission start time
  time_utc: "TBD-TIME-001"  # Mission authority will confirm

  # DEM and environment
  dem_file: "TBD-SIM-002"   # LRO LOLA or equivalent; region selection §10
  solar_elevation_deg: 15.0  # Initial solar angle (low horizon illumination)
  environment_seed: 42       # Random seed for reproducibility

# ======================================================
# WAYPOINT LIST
# ======================================================
waypoints:
  - id: "WP-001"
    x_m: 50.0
    y_m: 20.0
    label: "Science Target A — Crater north rim"
    science_ops: true
    science_duration_s: 300   # 5-minute measurement

  - id: "WP-002"
    x_m: 95.0
    y_m: 60.0
    label: "Science Target B — Regolith sample point"
    science_ops: true
    science_duration_s: 300

  - id: "WP-003"
    x_m: 120.0
    y_m: 80.0
    label: "Science Target C — LiDAR scan point"
    science_ops: true
    science_duration_s: 180

  - id: "WP-004"
    x_m: 90.0
    y_m: 110.0
    label: "Science Target D — Topographic summit"
    science_ops: true
    science_duration_s: 240

  - id: "WP-005"
    x_m: 40.0
    y_m: 90.0
    label: "Science Target E — Shadow boundary transition observation"
    science_ops: true
    science_duration_s: 300

  - id: "WP-BASE"
    x_m: 0.0
    y_m: 0.0
    label: "Base Camp / Safe Haven — Return point"
    science_ops: false
    is_safe_haven: true

# ======================================================
# EVENTS (Time or condition triggered)
# ======================================================
events:

  - id: "EVT-001"
    description: "Mission start — EKF convergence check"
    trigger:
      type: "time"
      time_offset_s: 0
    action:
      type: "check_ekf_convergence"
      max_wait_s: 30          # EKF convergence < 30s; otherwise notify FDIR

  - id: "EVT-002"
    description: "Start movement to first waypoint"
    trigger:
      type: "condition"
      condition: "ekf_converged AND safety_state == NOMINAL"
    action:
      type: "navigate_to_waypoint"
      waypoint_id: "WP-001"

  - id: "EVT-003"
    description: "WP-001 arrival — scientific data collection"
    trigger:
      type: "condition"
      condition: "at_waypoint(WP-001)"
    action:
      type: "science_ops"
      duration_s: 300
      sensors: ["spectrometer", "camera", "lidar_scan"]

  - id: "EVT-004"
    description: "Energy budget checkpoint — before WP-002"
    trigger:
      type: "condition"
      condition: "at_waypoint(WP-001) AND science_complete"
    action:
      type: "energy_budget_check"
      require_return_reserve: true  # HC-006: is return reserve sufficient?
      on_insufficient_reserve:
        action: "navigate_to_waypoint"
        waypoint_id: "WP-BASE"
        reason: "HC-006_reserve_insufficient"

  - id: "EVT-005"
    description: "WP-002 traverse and scientific operation"
    trigger:
      type: "condition"
      condition: "energy_budget_ok AND previous_event_success(EVT-004)"
    action:
      type: "navigate_to_waypoint"
      waypoint_id: "WP-002"

  - id: "EVT-006"
    description: "WP-003 traverse"
    trigger:
      type: "condition"
      condition: "at_waypoint(WP-002) AND science_complete"
    action:
      type: "navigate_to_waypoint"
      waypoint_id: "WP-003"

  - id: "EVT-007"
    description: "WP-004 traverse"
    trigger:
      type: "condition"
      condition: "at_waypoint(WP-003) AND science_complete"
    action:
      type: "navigate_to_waypoint"
      waypoint_id: "WP-004"

  - id: "EVT-008"
    description: "WP-005 traverse"
    trigger:
      type: "condition"
      condition: "at_waypoint(WP-004) AND science_complete"
    action:
      type: "navigate_to_waypoint"
      waypoint_id: "WP-005"

  - id: "EVT-009"
    description: "All waypoints completed — return to Base Camp"
    trigger:
      type: "condition"
      condition: "at_waypoint(WP-005) AND science_complete"
    action:
      type: "navigate_to_waypoint"
      waypoint_id: "WP-BASE"

  - id: "EVT-010"
    description: "If CAUTION triggered — do not continue, complete current waypoint safely"
    trigger:
      type: "condition"
      condition: "safety_state == CAUTION"
    action:
      type: "complete_current_waypoint_then_return"
      max_wait_before_return_s: 300

  - id: "EVT-011"
    description: "If RETURN_REQUIRED triggered — immediately return to Base Camp"
    trigger:
      type: "condition"
      condition: "safety_state == RETURN_REQUIRED"
    action:
      type: "emergency_return"
      destination: "WP-BASE"
      abort_all_science: true

  - id: "EVT-012"
    description: "Telemetry downlink — report to ground control every 60s"
    trigger:
      type: "periodic"
      interval_s: 60
    action:
      type: "downlink_telemetry"
      fields: ["position", "soc", "safety_state", "nav_uncertainty", "science_data_pending_kb"]

# ======================================================
# TERMINATION CRITERIA
# ======================================================
termination_criteria:

  success:
    - condition: "at_waypoint(WP-BASE)"
      description: "Vehicle returned to Base Camp"
    - condition: "soc_above_threshold"
      threshold_pct: 20.0
      description: "SoC remained above 20% (HC-006 margin)"

  partial_success:
    - condition: "at_waypoint(WP-BASE) AND waypoints_completed_count >= 3"
      description: "At least 3 waypoints completed and safe return made"

  failure:
    - condition: "soc_below_critical"
      threshold_pct: 10.0
      description: "SURVIVAL threshold exceeded"
    - condition: "safety_state_equals"
      state: "SURVIVAL"
      description: "SURVIVAL mode entered"
    - condition: "max_time_exceeded"
      max_duration_s: 28800  # 8-hour upper limit (TBD-SIM-012 dependent)
      description: "Maximum scenario duration exceeded"
    - condition: "vehicle_pose_lost"
      description: "Localisation completely lost and unrecoverable"

# ======================================================
# ACCEPTANCE CRITERIA (Test & Validation)
# ======================================================
acceptance_criteria:

  - id: "AC-001"
    description: "Each waypoint reached within ±1m RMS"
    metric: "waypoint_position_error_m"
    threshold: 1.0
    comparison: "less_than_or_equal"

  - id: "AC-002"
    description: "SoC never fell below 10%"
    metric: "soc_min_pct"
    threshold: 10.0
    comparison: "greater_than"

  - id: "AC-003"
    description: "Nav uncertainty never exceeded 1.0m RMS (without correction)"
    metric: "nav_uncertainty_max_m"
    threshold: 1.0
    comparison: "less_than_or_equal"

  - id: "AC-004"
    description: "Energy consumption remained within ±10% of nominal budget"
    metric: "energy_consumption_deviation_pct"
    threshold: 10.0
    comparison: "less_than_or_equal"

  - id: "AC-005"
    description: "All component temperatures remained in nominal range"
    metric: "thermal_critical_violations"
    threshold: 0
    comparison: "equals"

  - id: "AC-006"
    description: "Safety state remained NOMINAL (if CAUTION not triggered)"
    metric: "max_safety_state_reached"
    expected: "NOMINAL"
    note: "Nominal scenario; CAUTION/RETURN/SURVIVAL = failure"

  - id: "AC-007"
    description: "Each scientific operation completed within planned duration (±10%)"
    metric: "science_ops_duration_deviation_pct"
    threshold: 10.0
    comparison: "less_than_or_equal"

# ======================================================
# OUTPUT METRICS (Logging)
# ======================================================
output_metrics:
  log_level: "INFO"           # DEBUG | INFO | WARNING | ERROR
  log_interval_s: 1.0
  record:
    - position_x_m
    - position_y_m
    - position_z_m
    - heading_deg
    - velocity_ms
    - soc_percent
    - panel_power_w
    - nav_uncertainty_m
    - safety_state
    - mission_phase
    - battery_temp_c
    - obc_temp_c
    - link_active
    - link_quality_pct
    - active_fault_mask
    - science_data_pending_kb
  checkpoint_interval_s: 300  # Save simulator state every 5 minutes

# ======================================================
# NOTE
# ======================================================
notes: >
  This scenario is the base scenario for SIL regression testing (RT-001).
  It contains no fault injection; baseline metrics are produced from this scenario.
  All TBD values will be updated through config/tbd_register.md as §10 vehicle
  data arrives.
  Numerical waypoint coordinates will be replaced with real DEM coordinates after
  region selection (TBD-TIME-001) is confirmed.
