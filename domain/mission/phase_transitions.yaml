# status: draft
# owner: luna-ai-architecture
# depends_on:
#   - domain/mission/phase_state_machine.md
#   - domain/mission/constraints/hard_constraints_catalog.yaml
#   - interfaces/schemas/resource_state.schema.yaml
#   - interfaces/schemas/vehicle_command.schema.yaml
# open_items:
#   - SURFACE_EXPLORATION->PSR_OPS authority: tied to B1 autonomy matrix TBD
#   - CRUISE->LANDING guard conditions tied to GNC interface TBD(source: §10)

schema_version: "1.0.0"
description: >
  LUNA-AI mission phase transition table.
  Compliance Note 1: Defines only the mission phase axis.
  Safety states (nominal/caution/return_required/survival) are not defined in this file.

phases:
  - id: CRUISE
    description: "Pre-landing in orbit"
  - id: LANDING
    description: "Landing GNC active, prior to surface contact"
  - id: SURFACE_EXPLORATION
    description: "Nominal surface exploration, non-PSR"
  - id: PSR_OPS
    description: "Operation inside PSR"
  - id: RETURN
    description: "Active return to safe haven"
  - id: SAFE_STATE
    description: "Charge/thermal recovery; communication window wait"

transitions:

  # ── CRUISE ────────────────────────────────────────────────────────────────

  - id: T-001
    from: CRUISE
    to: LANDING
    trigger: landing_corridor_approved
    guard_conditions:
      - "landing_candidate.hc001_pass == true"
      - "landing_candidate.hc002_pass == true"
      - "landing_candidate.hc003_pass == true"
      - "resource_state.comm_visibility_deg >= HC-014.threshold"
    authority: ground_approved
    notes: "GNC transition to landing mode; TBD(source: §10 GNC interface)"

  # ── LANDING ───────────────────────────────────────────────────────────────

  - id: T-002
    from: LANDING
    to: SURFACE_EXPLORATION
    trigger: surface_contact_confirmed
    guard_conditions:
      - "vehicle_pose.surface_contact == true"
      - "vehicle_pose.stability_nominal == true"
      - "landing_site.hc001_pass == true"
      - "landing_site.hc002_pass == true"
      - "landing_site.hc003_pass == true"
      - "landing_site.hc004_pass == true"
      - "landing_site.hc005_pass == true"
      - "landing_window_product.landing_window_validated == true"   # A3-EK: lunar-navigator when-to-land output
      - "earth_visibility_windows.earth_visibility_confirmed == true"  # A3-EK: HC-018 requirement
    authority: ground_approved
    notes: "System health check nominal. Landing constraints post-landing verification. A3-EK: landing_window and earth_visibility approval mandatory."

  - id: T-003
    from: LANDING
    to: SAFE_STATE
    trigger: post_landing_safe_mode
    guard_conditions:
      - "vehicle_pose.surface_contact == true"
      - "safe_haven_loaded == true"
    authority: autonomous
    notes: "Temporary safe state after landing; for system check."

  # ── SURFACE_EXPLORATION ───────────────────────────────────────────────────

  - id: T-004
    from: SURFACE_EXPLORATION
    to: PSR_OPS
    trigger: psr_entry_approved
    guard_conditions:
      - "resource_state.return_reserve_wh >= HC-006.threshold"           # Item 1: return reserve
      - "resource_state.thermal_margin_c >= HC-007.threshold"             # Item 2: thermal margin
      - "comm_window_ok == true OR pre_planned_abort_trigger_set == true" # Item 3: communication
      - "vehicle_pose.position_uncertainty_m <= QAR-NAV-002.target"       # Item 4: localisation
      - "science_target_approved == true"                                  # Item 5: scientific target
      - "safe_haven_backup_loaded == true"                                 # Item 6: backup safe haven
    authority: ground_approved  # TBD: autonomous option tied to B1 autonomy matrix
    notes: "6-item checklist: phase_state_machine.md §4.3.1. Vehicle waits for vehicle_command.psr_entry_checklist_complete: true."

  - id: T-005
    from: SURFACE_EXPLORATION
    to: RETURN
    trigger: return_condition_met
    guard_conditions:
      - "resource_state.return_reserve_wh <= (HC-006.threshold * 1.1) OR ground_return_command == true OR fdir_trigger == true"
    authority: autonomous
    notes: "10% early warning threshold. FDIR trigger results in emergency_autonomous."

  - id: T-006
    from: SURFACE_EXPLORATION
    to: SAFE_STATE
    trigger: charge_or_thermal_required
    guard_conditions:
      - "resource_state.state_of_charge_pct <= charge_threshold_pct OR resource_state.thermal_margin_c <= thermal_warning_threshold_c"
      - "safe_haven_reachable == true"
    authority: autonomous
    notes: "Charge or thermal recovery requirement."

  # ── PSR_OPS ───────────────────────────────────────────────────────────────

  - id: T-007
    from: PSR_OPS
    to: RETURN
    trigger: return_condition_met
    guard_conditions:
      - "resource_state.return_reserve_wh <= (HC-006.threshold * 1.1) OR science_objectives_complete == true OR emergency_return_command == true OR fdir_trigger == true"
    authority: autonomous
    notes: >
      Primary exit path. When return reserve reaches early warning threshold, planner
      drops mission and transitions to RETURN. FDIR trigger results in emergency_autonomous.

  - id: T-008
    from: PSR_OPS
    to: SAFE_STATE
    trigger: emergency_survival_trigger
    guard_conditions:
      - "resource_state.power_mode == survival"
      - "resource_state.return_reserve_wh < HC-006.threshold"
      - "nearest_safe_haven_reachable == true"
    authority: emergency_autonomous
    notes: "FDIR only. Return energy insufficient + survival mode. Routes to nearest safe haven."

  # ── RETURN ────────────────────────────────────────────────────────────────

  - id: T-009
    from: RETURN
    to: SAFE_STATE
    trigger: safe_haven_reached
    guard_conditions:
      - "distance_to_safe_haven_m <= HC-015.threshold"
      - "safe_haven_hc009_pass == true"
      - "safe_haven_hc010_pass == true"
      - "safe_haven_hc011_pass == true"
      - "safe_haven_hc013_pass == true"
      - "safe_haven_hc014_pass == true"
    authority: autonomous
    notes: "Safe haven criteria approval list (scope HC-009..HC-015)."

  - id: T-010
    from: RETURN
    to: SURFACE_EXPLORATION
    trigger: return_cancelled_by_ground
    guard_conditions:
      - "ground_command_authority == ground_approved"
      - "resource_state.return_reserve_wh >= (HC-006.threshold * 1.5)"
      - "resource_state.thermal_margin_c >= HC-007.threshold"
    authority: ground_approved
    notes: "Exceptional case: ground segment cancels return. 150% reserve margin mandatory."

  # ── SAFE_STATE ────────────────────────────────────────────────────────────

  - id: T-011
    from: SAFE_STATE
    to: SURFACE_EXPLORATION
    trigger: recovery_complete_and_mission_resumed
    guard_conditions:
      - "resource_state.state_of_charge_pct >= hc008_threshold_pct"
      - "resource_state.thermal_margin_c >= HC-007.threshold"
      - "new_mission_package_received == true"
      - "resource_state.comm_visibility_deg >= HC-014.threshold"
    authority: ground_approved
    notes: "Transition after receiving new mission package (mission_package.schema.yaml)."

  - id: T-012
    from: SAFE_STATE
    to: LANDING
    trigger: mission_abort_ground_command
    guard_conditions:
      - "ground_command_authority == ground_approved"
      - "mission_abort_flag == true"
    authority: ground_approved
    notes: "Mission abort scenario only. Return to landing site."

# ── Emergency Transitions (from any phase) ──────────────────────────────────

emergency_transitions:

  - id: ET-001
    from: any
    to: RETURN
    trigger: fdir_emergency_return
    guard_conditions:
      - "safety_state IN [RETURN_REQUIRED]"
      - "resource_state.return_reserve_wh >= HC-006.threshold"
    authority: emergency_autonomous
    notes: "Safety state RETURN_REQUIRED + sufficient energy → emergency RETURN."

  - id: ET-002
    from: any
    to: SAFE_STATE
    trigger: fdir_survival_to_safe_haven
    guard_conditions:
      - "safety_state == SURVIVAL"
      - "resource_state.return_reserve_wh < HC-006.threshold"
      - "nearest_safe_haven_reachable == true"
    authority: emergency_autonomous
    notes: "Return energy insufficient + SURVIVAL → nearest safe haven."
