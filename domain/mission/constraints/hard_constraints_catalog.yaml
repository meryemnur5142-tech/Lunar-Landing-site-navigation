# status: draft
# owner: luna-ai-architecture
# depends_on:
#   - docs/conops/CONOPS.md
#   - docs/qar/QAR_TABLE.md
#   - docs/adr/ADR-001..ADR-006
# open_items:
#   - HC-001 threshold TBD(source: §10)
#   - HC-002 threshold TBD(source: §10)
#   - HC-004 threshold TBD(source: §10)
#   - HC-005 threshold TBD(source: §10)
#   - HC-006 threshold TBD(source: §10)
#   - HC-007 threshold TBD(source: §10 thermal model)
#   - HC-008 threshold TBD(source: §10)
#   - HC-009..HC-015 safe_haven thresholds TBD(source: §10)

schema_version: "1.0.0"
catalog_id: "luna-ai-hard-constraints-v1.1"
classification_note: >
  Hard constraints are evaluated first (pass/fail elimination).
  No multi-criteria ranking score may override a hard constraint violation.
  Ref: Compliance Note 5.

constraints:

  # ── Terrain / Landing Constraints ────────────────────────────────────────────

  - id: HC-001
    name: "Maximum Landing Site Slope"
    parameter: max_slope_deg
    operator: lte
    threshold: 15.0  # TBD(source: §10) — vehicle rollover stability
    unit: deg
    classification: hard
    source: "v1.0 §4.1, QAR-MOB-001"
    applies_to_phases:
      - landing
    verification_method: analysis
    rationale: "Vehicle rollover risk — recovery not possible"

  - id: HC-002
    name: "Maximum Surface Roughness RMS"
    parameter: surface_roughness_rms_m
    operator: lte
    threshold: 0.30  # TBD(source: §10) — landing leg design limit
    unit: m
    classification: hard
    source: "v1.0 §4.1, QAR-LND-002"
    applies_to_phases:
      - landing
    verification_method: simulation_and_test
    rationale: "Landing leg damage risk — mission loss"

  - id: HC-003
    name: "Maximum Rock / Obstacle Density"
    parameter: obstacle_fraction
    operator: lte
    threshold: 0.20
    unit: "fraction (0-1)"
    classification: hard
    source: "v1.0 §4.3, QAR-LND-003"
    applies_to_phases:
      - landing
      - surface_exploration
    verification_method: analysis
    rationale: "Rock avoidance algorithm operates outside guarantee bounds"

  - id: HC-004
    name: "Minimum Landing Ellipse Flatness"
    parameter: slope_variance_deg2
    operator: lte
    threshold: null  # TBD(source: §10) — slope variance; irregular areas eliminated
    unit: "deg^2"
    classification: hard
    source: "v1.0 §4.1"
    applies_to_phases:
      - landing
    verification_method: analysis
    rationale: "Irregularity inside landing ellipse exceeds landing GNC error budget"

  - id: HC-005
    name: "Vehicle Accessibility Approach Profile Slope"
    parameter: approach_slope_deg
    operator: lte
    threshold: null  # TBD(source: §10) — ≤ vehicle max climb angle
    unit: deg
    classification: hard
    source: "v1.0 §4.3, QAR-MOB-002"
    applies_to_phases:
      - surface_exploration
      - psr_ops
    verification_method: simulation
    rationale: "Vehicle entrapment risk — recovery impossible"

  # ── Energy / Thermal Constraints ──────────────────────────────────────────────

  - id: HC-006
    name: "Minimum Return Energy Reserve"
    parameter: return_reserve_wh
    operator: gte
    threshold: null  # TBD(source: §10) — computed by Power Mgmt, enforced by planner
    unit: Wh
    classification: hard
    source: "Compliance Note 3; safety/safety_budget.md §2"
    applies_to_phases:
      - surface_exploration
      - psr_ops
      - return
    verification_method: analysis_and_simulation
    rationale: >
      Power Management module computes and reports to planner.
      Planner enforces as hard constraint — never computes independently.
      If vehicle return energy is insufficient, mission loss occurs.
    computed_by: power_management_module
    consumed_by: planner_as_hard_constraint

  - id: HC-007
    name: "Minimum Safe Darkness Tolerance Margin"
    parameter: thermal_margin_c
    operator: gte
    threshold: null  # TBD(source: §10 thermal model) — VIPER 50s not universally applicable
    unit: degC
    classification: hard
    source: "v1.0 §5.3, Compliance Note 3"
    applies_to_phases:
      - psr_ops
      - return
      - safe_state
    verification_method: thermal_analysis
    rationale: "If thermal margin drops below zero, battery/component damage is permanent; vehicle-dependent model"
    note: "VIPER 50s tolerance is not transferred directly here — vehicle thermal model sourced from §10"

  - id: HC-008
    name: "Minimum Battery SoC at PSR Entry"
    parameter: battery_soc_pct
    operator: gte
    threshold: null  # TBD(source: §10)
    unit: "percent"
    classification: hard
    source: "v1.0 §5.2, QAR-PWR-001"
    applies_to_phases:
      - psr_ops
    verification_method: test_and_analysis
    rationale: "If insufficient energy inside PSR, communication + heating is severed"

  # ── Safe Haven Constraints — 7 Criteria (Compliance Note 2) ──────────────────

  - id: HC-009
    name: "Minimum Continuous Illumination Duration"
    parameter: continuous_illumination_hr
    operator: gte
    threshold: null  # TBD(source: §10)
    unit: hours
    classification: hard
    safe_haven_criterion: 1
    safe_haven_criterion_name: "continuous_illumination"
    source: "v1.0 §6.1, Compliance Note 2"
    applies_to_phases:
      - safe_state
    verification_method: orbital_analysis
    rationale: "If charge window is insufficient, safe haven is invalid"

  - id: HC-010
    name: "Maximum Acceptable Darkness Interval"
    parameter: max_darkness_interval_hr
    operator: lte
    threshold: null  # TBD(source: §10)
    unit: hours
    classification: hard
    safe_haven_criterion: 2
    safe_haven_criterion_name: "darkness_interval"
    source: "v1.0 §6.2, Compliance Note 2"
    applies_to_phases:
      - safe_state
    verification_method: orbital_analysis
    rationale: "If darkness tolerance exceeded, thermal survival is compromised"

  - id: HC-011
    name: "Recharge Opportunity"
    parameter: recharge_capacity_wh_per_sol
    operator: gte
    threshold: null  # TBD(source: §10) — illumination_hr × panel_efficiency >= threshold
    unit: "Wh/sol"
    classification: hard
    safe_haven_criterion: 3
    safe_haven_criterion_name: "recharge_opportunity"
    source: "v1.0 §6.3, Compliance Note 2"
    applies_to_phases:
      - safe_state
    verification_method: analysis
    rationale: "If no recharge opportunity, safe haven is unsustainable"
    formula: "illumination_hr * panel_efficiency_wh_per_hr >= threshold"

  - id: HC-012
    name: "Return Energy Adequacy"
    parameter: return_energy_budget_wh
    operator: gte
    threshold: "distance_m * energy_per_m_wh + uncertainty_margin_wh"  # formula; numerical values §10
    unit: Wh
    classification: hard
    safe_haven_criterion: 4
    safe_haven_criterion_name: "return_energy"
    source: "v1.0 §6.4, Compliance Note 2; overlaps with HC-006"
    applies_to_phases:
      - return
      - safe_state
    verification_method: simulation
    rationale: "Safe haven→origin distance × consumption ≤ reserve; otherwise vehicle cannot return"

  - id: HC-013
    name: "Thermal Safety (Safe Haven)"
    parameter:
      - surface_temp_c
      - solar_angle_deg
    operator: within_limits
    threshold: null  # TBD(source: §10) — solar angle and surface temperature limits
    unit: "degC, deg"
    classification: hard
    safe_haven_criterion: 5
    safe_haven_criterion_name: "thermal_safety"
    source: "v1.0 §6.5, Compliance Note 2"
    applies_to_phases:
      - safe_state
    verification_method: thermal_analysis
    rationale: "If thermal limit exceeded, component failure is inevitable"

  - id: HC-014
    name: "Communication Visibility Opportunity"
    parameter:
      - comm_visibility_deg
      - comm_window_min_per_sol
    operator: gte
    threshold: null  # TBD(source: §10) — ≥ X° or ≥ Y min/sol
    unit: "deg or min/sol"
    classification: hard
    safe_haven_criterion: 6
    safe_haven_criterion_name: "communication"
    source: "v1.0 §6.6, Compliance Note 2"
    applies_to_phases:
      - cruise
      - landing
      - surface_exploration
      - psr_ops
      - return
      - safe_state
    verification_method: link_analysis
    rationale: "If communication severed, ground intervention is not possible; autonomous decisions are restricted"

  - id: HC-015
    name: "Emergency Access Distance"
    parameter: emergency_route_distance_m
    operator: lte
    threshold: null  # TBD(source: §10)
    unit: m
    classification: hard
    safe_haven_criterion: 7
    safe_haven_criterion_name: "emergency_access"
    source: "v1.0 §6.7, Compliance Note 2"
    applies_to_phases:
      - surface_exploration
      - psr_ops
      - return
    verification_method: simulation
    rationale: "A safe haven without emergency access is non-functional in crisis scenarios"

  # ── Site Finder Metrics — Additional Hard Constraints (A1-EK) ─────────────────
  # Source: daniel27-space/lunar-navigator site finder module
  # Compliance Note 5: Site finder ranking score (weighted sum) does not make safety decisions.
  # Ranking is applied only to candidates that pass HC.

  - id: HC-016
    name: "Site Finder Minimum Sun Fraction"
    parameter: site_sun_fraction
    operator: gte
    threshold: null  # TBD(source: §10) — lunar-navigator site finder metric
    unit: "fraction (0-1)"
    classification: hard
    source: "lunar-navigator site finder; Compliance Note 5"
    applies_to_phases:
      - surface_exploration
      - safe_state
    verification_method: orbital_analysis
    rationale: "If sun fraction below threshold, charging is insufficient — safe haven invalid"
    note: "Site finder ranking does not make safety decisions. This HC is for elimination."

  - id: HC-017
    name: "Site Finder Minimum Earth Visibility Fraction"
    parameter: site_earth_fraction
    operator: gte
    threshold: null  # TBD(source: §10) — lunar-navigator earth_fraction metric
    unit: "fraction (0-1)"
    classification: hard
    source: "lunar-navigator site finder; Compliance Note 5"
    applies_to_phases:
      - surface_exploration
      - safe_state
    verification_method: orbital_analysis
    rationale: "If Earth visibility below threshold, communication risk — overlaps with HC-014"
    note: "Weighted sum alone cannot make safety decisions. This HC is for elimination."

  - id: HC-018
    name: "Landing Time Earth Visibility Window Validation"
    parameter: earth_visibility_confirmed
    operator: eq
    threshold: true
    unit: bool
    classification: hard
    source: "interfaces/schemas/earth_visibility_windows.schema.yaml; lunar-navigator pipeline/ephem/"
    applies_to_phases:
      - landing
    verification_method: link_analysis
    rationale: "If Earth visibility at landing time is unconfirmed, landing abort risk"
    note: "Fed from earth_visibility_windows.schema.yaml earth_visible field"
