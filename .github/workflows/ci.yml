name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (GDAL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gdal-bin libgdal-dev python3-gdal

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # GDAL Python bağlaması sistem GDAL versiyonuyla eşleşmeli
          GDAL_VERSION=$(gdal-config --version)
          pip install "gdal==${GDAL_VERSION}"
          pip install -r requirements.txt
          pip install pytest pytest-cov pyyaml

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/unit/ -v --tb=short

      - name: Run API route tests
        run: |
          PYTHONPATH=. pytest tests/api/ -v --tb=short

      - name: Run integration tests
        run: |
          PYTHONPATH=. pytest tests/integration/ -v --tb=short

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check . --select E,F --ignore E501
        continue-on-error: true

      - name: Validate interface schemas (YAML syntax)
        run: |
          find interfaces/ -name "*.schema.yaml" | while read f; do
            python -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" \
              && echo "OK: $f" || (echo "FAIL: $f" && exit 1)
          done
