name: LUNA Python 3.12 Tests
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'luna-ai-viper/**'
      - '.github/workflows/python-312-tests.yml'
  pull_request:
    paths:
      - 'luna-ai-viper/**'
      - '.github/workflows/python-312-tests.yml'
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: luna-ai-viper/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r luna-ai-viper/requirements.txt
      - name: Compile Python files
        run: python -m compileall -q luna-ai-viper
      - name: Navigator offline regression tests
        working-directory: luna-ai-viper
        run: python ay_navigator.py --test
      - name: API offline regression tests
        working-directory: luna-ai-viper
        run: python ay_api.py --test
