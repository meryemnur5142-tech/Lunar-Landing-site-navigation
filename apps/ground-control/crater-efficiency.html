<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNA-AI — İniş Verimliliği</title>
<style>
:root {
  --bg:        #04080f;
  --bg-card:   #08111f;
  --bg-hover:  #0d1a2e;
  --bg-sel:    #0a1e35;
  --accent:    #00d4ff;
  --accent2:   #0088cc;
  --green:     #00e87a;
  --amber:     #ffa940;
  --red:       #ff4455;
  --purple:    #a78bfa;
  --text:      #d8ecf8;
  --text-dim:  #6a94aa;
  --text-muted:#334455;
  --border:    #0d2035;
  --border-hi: #004466;
  --glow:      rgba(0,212,255,.12);
  --glow-str:  rgba(0,212,255,.30);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Courier New',monospace;
  min-height:100vh;
  overflow-x:hidden;
}

/* scanlines overlay */
body::before{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);
  pointer-events:none;z-index:1000;
}

/* ── HEADER ─────────────────────────────────── */
header{
  display:flex;align-items:center;gap:1rem;
  padding:.75rem 1.25rem;
  background:linear-gradient(90deg,#060e1c,#09132a);
  border-bottom:1px solid var(--border-hi);
}
.logo{
  font-size:1.1rem;font-weight:700;letter-spacing:.15em;
  color:var(--accent);text-shadow:0 0 10px var(--accent2);
}
.logo span{color:var(--text-dim);font-weight:400;}
.mission-badge{
  margin-left:auto;
  font-size:.65rem;letter-spacing:.1em;
  background:rgba(0,212,255,.08);
  border:1px solid var(--border-hi);
  color:var(--accent);padding:.25rem .6rem;border-radius:3px;
}
.status-dot{
  width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 6px var(--green);display:inline-block;margin-right:.4rem;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── LAYOUT ──────────────────────────────────── */
.app{
  display:grid;
  grid-template-columns:230px 1fr;
  grid-template-rows:auto 1fr auto;
  min-height:calc(100vh - 46px);
}

/* ── CRATER SIDEBAR ──────────────────────────── */
.sidebar{
  grid-row:1/3;
  border-right:1px solid var(--border);
  padding:.75rem .6rem;
  overflow-y:auto;
}
.sidebar-title{
  font-size:.6rem;letter-spacing:.18em;color:var(--text-dim);
  text-transform:uppercase;padding:.3rem .4rem .6rem;
  border-bottom:1px solid var(--border);margin-bottom:.5rem;
}
.crater-btn{
  width:100%;background:none;border:1px solid transparent;
  color:var(--text);font-family:inherit;font-size:.75rem;
  padding:.55rem .7rem;border-radius:4px;cursor:pointer;
  display:flex;flex-direction:column;gap:.2rem;
  text-align:left;transition:all .15s;margin-bottom:3px;
}
.crater-btn:hover{
  background:var(--bg-hover);border-color:var(--border-hi);
}
.crater-btn.active{
  background:var(--bg-sel);border-color:var(--accent2);
  box-shadow:0 0 8px var(--glow);
}
.crater-btn .cname{font-weight:700;color:var(--text);}
.crater-btn .cstats{color:var(--text-dim);font-size:.65rem;}
.crater-btn .cpsr{
  font-size:.62rem;padding:.1rem .35rem;border-radius:2px;
  background:rgba(0,212,255,.07);color:var(--accent2);
  display:inline-block;margin-top:.15rem;
}
.crater-btn.has-warning .cname::after{
  content:'⚠';font-size:.6rem;margin-left:.3rem;color:var(--amber);
}

/* ── MAIN PANEL ──────────────────────────────── */
.main{padding:1rem 1.25rem;}

/* crater info card */
.crater-info{
  display:flex;gap:1.5rem;align-items:flex-start;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:6px;padding:.85rem 1rem;margin-bottom:1rem;
  flex-wrap:wrap;
}
.crater-info.hidden{display:none;}
.crater-info-title{
  font-size:.95rem;font-weight:700;color:var(--accent);
  margin-bottom:.4rem;letter-spacing:.05em;
}
.crater-info-meta{font-size:.7rem;color:var(--text-dim);line-height:1.6;}
.crater-info-meta b{color:var(--text);}
.info-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.5rem;flex:1;
}
.info-chip{
  background:rgba(0,212,255,.05);border:1px solid var(--border-hi);
  border-radius:4px;padding:.45rem .65rem;
}
.info-chip .ic-label{font-size:.58rem;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;}
.info-chip .ic-val{font-size:.85rem;font-weight:700;color:var(--text);margin-top:.1rem;}
.info-chip .ic-unit{font-size:.6rem;color:var(--text-dim);}

/* section heading */
.section-heading{
  font-size:.62rem;letter-spacing:.18em;color:var(--text-dim);
  text-transform:uppercase;margin-bottom:.7rem;
  display:flex;align-items:center;gap:.5rem;
}
.section-heading::after{
  content:'';flex:1;height:1px;background:var(--border);
}

/* ── WINDOW CARDS ────────────────────────────── */
.windows-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:.75rem;
  margin-bottom:1rem;
}
.win-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:6px;padding:1rem;cursor:pointer;
  transition:all .2s;position:relative;overflow:hidden;
}
.win-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent2),transparent);
  opacity:0;transition:opacity .2s;
}
.win-card:hover{background:var(--bg-hover);border-color:var(--border-hi);}
.win-card:hover::before{opacity:.5;}
.win-card.selected{
  border-color:var(--accent);
  box-shadow:0 0 16px var(--glow-str),inset 0 0 20px var(--glow);
}
.win-card.selected::before{opacity:1;}
.win-card.best-mark{border-color:var(--green);}
.win-card.best-mark::before{background:linear-gradient(90deg,transparent,var(--green),transparent);}

.win-label{
  font-size:.62rem;letter-spacing:.15em;color:var(--text-dim);
  margin-bottom:.3rem;display:flex;justify-content:space-between;
}
.best-tag{
  font-size:.58rem;background:rgba(0,232,122,.12);
  color:var(--green);border:1px solid rgba(0,232,122,.3);
  padding:.05rem .35rem;border-radius:2px;letter-spacing:.05em;
}

.eff-num{
  font-size:2.4rem;font-weight:700;line-height:1;
  margin:.2rem 0 .5rem;
}
.eff-pct{font-size:1.1rem;color:var(--text-dim);}

.win-time{
  font-size:.62rem;color:var(--text-muted);margin-bottom:.75rem;
  border-bottom:1px solid var(--border);padding-bottom:.5rem;
}

/* metric rows */
.metrics{display:flex;flex-direction:column;gap:.35rem;}
.metric-row{display:flex;align-items:center;gap:.5rem;}
.metric-icon{font-size:.7rem;width:16px;text-align:center;flex-shrink:0;}
.metric-label{font-size:.62rem;color:var(--text-dim);flex:1;min-width:0;}
.metric-bar-wrap{
  width:70px;height:5px;background:var(--border);border-radius:3px;
  flex-shrink:0;overflow:hidden;
}
.metric-bar{height:100%;border-radius:3px;transition:width .4s;}
.metric-val{font-size:.6rem;color:var(--text-dim);width:36px;text-align:right;flex-shrink:0;}

/* ── DECISION PANEL ──────────────────────────── */
.decision-panel{
  display:none;
  grid-column:1/-1;
  background:var(--bg-card);
  border-top:1px solid var(--border-hi);
  padding:1.1rem 1.5rem;
}
.decision-panel.visible{display:block;}

.dec-header{
  display:flex;align-items:center;gap:1rem;margin-bottom:.85rem;flex-wrap:wrap;
}
.dec-window-badge{
  font-size:.75rem;font-weight:700;letter-spacing:.08em;
  background:linear-gradient(135deg,rgba(0,212,255,.12),rgba(0,212,255,.04));
  border:1px solid var(--accent2);color:var(--accent);
  padding:.3rem .8rem;border-radius:4px;
}
.dec-eff-badge{
  font-size:1.5rem;font-weight:700;
}
.dec-title{
  font-size:.62rem;letter-spacing:.12em;color:var(--text-dim);
  text-transform:uppercase;
}
.dec-compare{
  margin-left:auto;
  display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;
}
.cmp-chip{
  font-size:.65rem;padding:.2rem .5rem;border-radius:3px;
  border:1px solid var(--border);color:var(--text-dim);
}
.cmp-chip.cmp-sel{
  border-color:var(--accent2);color:var(--accent);
  background:rgba(0,212,255,.07);
}

.explanation{
  font-size:.78rem;line-height:1.75;color:var(--text);
  max-width:900px;
  background:rgba(0,0,0,.2);border-left:2px solid var(--accent2);
  padding:.75rem 1rem;border-radius:0 4px 4px 0;
}
.explanation strong{color:var(--accent);}
.explanation em{color:var(--amber);}

/* empty state */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:200px;color:var(--text-muted);font-size:.75rem;gap:.5rem;
  grid-column:1/-1;
}
.empty-state .big{font-size:2rem;}

/* scrollbar */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:#060b18;}
::-webkit-scrollbar-thumb{background:#1a3045;border-radius:3px;}

/* responsive */
@media(max-width:600px){
  .app{grid-template-columns:1fr;}
  .sidebar{grid-row:auto;border-right:none;border-bottom:1px solid var(--border);}
  .crater-info{flex-direction:column;}
}
</style>
</head>
<body>

<header>
  <div class="logo">LUNA<span>-AI</span></div>
  <div style="font-size:.7rem;color:var(--text-dim)">İniş Verimliliği Analizi</div>
  <div class="mission-badge"><span class="status-dot"></span>LUNA-M1 · 2026-11</div>
</header>

<div class="app">

  <!-- sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">Krater Seçimi</div>
    <div id="craterList"></div>
  </aside>

  <!-- main -->
  <main class="main">

    <!-- crater info -->
    <div class="crater-info hidden" id="craterInfo">
      <div>
        <div class="crater-info-title" id="ci-name">—</div>
        <div class="crater-info-meta" id="ci-meta"></div>
      </div>
      <div class="info-grid" id="ci-grid"></div>
    </div>

    <!-- windows -->
    <div class="section-heading" id="windowsHeading" style="display:none">
      Verimlilik Pencereleri
    </div>
    <div class="windows-grid" id="windowsGrid">
      <div class="empty-state">
        <span class="big">🌑</span>
        <span>Sol panelden bir krater seçin</span>
      </div>
    </div>

  </main>

  <!-- decision panel (full width, below grid) -->
  <div class="decision-panel" id="decisionPanel">
    <div class="dec-header">
      <div>
        <div class="dec-title">Seçilen Pencere</div>
        <div style="display:flex;align-items:baseline;gap:.6rem;margin-top:.3rem;">
          <div class="dec-window-badge" id="dec-win-label">—</div>
          <div class="dec-eff-badge" id="dec-eff-num">—</div>
        </div>
      </div>
      <div class="dec-compare" id="dec-compare"></div>
    </div>
    <div class="section-heading">Neden Bu Pencere?</div>
    <div class="explanation" id="dec-explanation"></div>
  </div>

</div>

<script>
// ───────────────────────────────────────────────
//  DATA
// ───────────────────────────────────────────────
const CRATERS = [
  { id:'SP-006', name:'Malapert A',    lat:-86.0,  lon:357.4, diam:15,  slope:3.5,  rough:0.12, rocks:0.05, psr:0.18, note:null },
  { id:'SP-002', name:'Haworth',       lat:-86.9,  lon:358.1, diam:51,  slope:7.3,  rough:0.21, rocks:0.09, psr:0.55, note:null },
  { id:'SP-004', name:'de Gerlache',   lat:-88.5,  lon:272.0, diam:32,  slope:10.8, rough:0.25, rocks:0.13, psr:0.63, note:null },
  { id:'SP-001', name:'Shackleton',    lat:-89.9,  lon:0.0,   diam:21,  slope:12.5, rough:0.28, rocks:0.11, psr:0.82, note:null },
  { id:'SP-007', name:'Cabeus A',      lat:-85.3,  lon:316.0, diam:42,  slope:11.2, rough:0.38, rocks:0.16, psr:0.58, note:'LCROSS onaylı su buzu' },
  { id:'SP-003', name:'Nobile',        lat:-85.2,  lon:53.5,  diam:73,  slope:9.1,  rough:0.35, rocks:0.21, psr:0.48, note:'HC-003 kaya sınırı aşıldı' },
];

const ORBITAL_WINDOWS = [
  { label:'W-1', time:'2026-11-23 14:32 UTC', solar:3.2, earth:12.5, angle:8.0,  dv:0  },
  { label:'W-2', time:'2026-11-24 02:17 UTC', solar:2.5, earth:8.0,  angle:10.0, dv:12 },
  { label:'W-3', time:'2026-11-24 19:55 UTC', solar:1.8, earth:5.5,  angle:12.0, dv:28 },
  { label:'W-4', time:'2026-11-25 11:40 UTC', solar:1.2, earth:3.0,  angle:15.0, dv:45 },
];

// ───────────────────────────────────────────────
//  EFFICIENCY CALCULATOR
// ───────────────────────────────────────────────
function computeEff(crater, win) {
  const slopeNorm = Math.max(0, 1 - crater.slope / 12);
  const roughNorm = Math.max(0, 1 - crater.rough / 0.5);
  const rockNorm  = Math.max(0, 1 - crater.rocks / 0.15);
  const terrainQ  = slopeNorm * 0.50 + roughNorm * 0.25 + rockNorm * 0.25;

  const scienceQ  = crater.psr * 0.70 + (1 - crater.rocks) * 0.30;

  const solarQ = Math.min(1, win.solar / 3.5);
  const commQ  = Math.min(1, win.earth / 12);
  const propQ  = Math.max(0, 1 - win.dv / 60);
  const windowQ = solarQ * 0.40 + commQ * 0.30 + propQ * 0.30;

  const composite = terrainQ * 0.35 + scienceQ * 0.25 + windowQ * 0.40;
  const scaled = composite > 0.70
    ? 0.70 + (composite - 0.70) * 1.80
    : composite;

  return Math.round(Math.min(99, Math.max(85, 85 + scaled * 15)));
}

function effColor(pct) {
  if (pct >= 97) return 'var(--green)';
  if (pct >= 94) return 'var(--accent)';
  if (pct >= 91) return 'var(--amber)';
  return 'var(--red)';
}

function solarFlux(deg) { return Math.round(1361 * Math.sin(deg * Math.PI / 180)); }
function linkMargin(deg) { return (deg * 0.67 - 0.5).toFixed(1); }
function commLabel(deg) {
  if (deg >= 10) return 'Doğrudan LRS-1';
  if (deg >= 5)  return 'Marjinal / LRO röle';
  return 'Yalnızca röle';
}

// ───────────────────────────────────────────────
//  UI STATE
// ───────────────────────────────────────────────
let selectedCrater = null;
let selectedWinIdx = null;
let cachedEffs = [];

// ───────────────────────────────────────────────
//  RENDER: sidebar
// ───────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('craterList');
  list.innerHTML = '';
  CRATERS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'crater-btn' + (c.note ? ' has-warning' : '');
    if (selectedCrater && selectedCrater.id === c.id) btn.classList.add('active');
    btn.innerHTML = `
      <span class="cname">${c.name}</span>
      <span class="cstats">${c.lat.toFixed(1)}°S · ⌀ ${c.diam} km · ${c.slope}° eğim</span>
      <span class="cpsr">PSR ${Math.round(c.psr*100)}%</span>
      ${c.note ? `<span style="font-size:.58rem;color:var(--amber)">${c.note}</span>` : ''}
    `;
    btn.onclick = () => selectCrater(c);
    list.appendChild(btn);
  });
}

// ───────────────────────────────────────────────
//  RENDER: crater info
// ───────────────────────────────────────────────
function renderCraterInfo(c) {
  const ci = document.getElementById('craterInfo');
  ci.classList.remove('hidden');
  document.getElementById('ci-name').textContent = c.name;
  document.getElementById('ci-meta').innerHTML =
    `<b>Koordinat:</b> ${Math.abs(c.lat).toFixed(1)}°G · ${c.lon.toFixed(1)}°D &nbsp;|&nbsp;
     <b>Çap:</b> ${c.diam} km &nbsp;|&nbsp;
     <b>Kaynak:</b> Robbins2019 / LROC`;

  const chips = [
    { l:'Maks. Eğim', v:`${c.slope}°`,   u:'derece' },
    { l:'Pürüzlülük', v:`${c.rough} m`,  u:'RMS' },
    { l:'Kaya Örtüsü', v:`${Math.round(c.rocks*100)}%`, u:'yüzde alan' },
    { l:'PSR Erişimi', v:`${Math.round(c.psr*100)}%`, u:'elips kesişimi' },
  ];
  document.getElementById('ci-grid').innerHTML = chips.map(ch =>
    `<div class="info-chip">
       <div class="ic-label">${ch.l}</div>
       <div class="ic-val">${ch.v} <span class="ic-unit">${ch.u}</span></div>
     </div>`
  ).join('');
}

// ───────────────────────────────────────────────
//  RENDER: windows
// ───────────────────────────────────────────────
function renderWindows(c) {
  cachedEffs = ORBITAL_WINDOWS.map(w => computeEff(c, w));
  const bestIdx = cachedEffs.indexOf(Math.max(...cachedEffs));

  document.getElementById('windowsHeading').style.display = 'flex';
  const grid = document.getElementById('windowsGrid');
  grid.innerHTML = '';

  ORBITAL_WINDOWS.forEach((w, i) => {
    const eff = cachedEffs[i];
    const isBest = i === bestIdx;
    const isSel  = i === selectedWinIdx;
    const col    = effColor(eff);

    const solarQ = Math.min(1, w.solar / 3.5);
    const commQ  = Math.min(1, w.earth / 12);
    const propQ  = Math.max(0, 1 - w.dv / 60);
    const flux   = solarFlux(w.solar);
    const lm     = linkMargin(w.earth);

    const card = document.createElement('div');
    card.className = 'win-card' +
      (isBest ? ' best-mark' : '') +
      (isSel  ? ' selected'  : '');
    card.onclick = () => selectWindow(i);

    card.innerHTML = `
      <div class="win-label">
        <span>${w.label}</span>
        ${isBest ? '<span class="best-tag">EN VERİMLİ</span>' : ''}
      </div>
      <div class="eff-num" style="color:${col}">
        ${eff}<span class="eff-pct">%</span>
      </div>
      <div class="win-time">${w.time}</div>
      <div class="metrics">
        ${metric('☀', 'Güneş açısı', solarQ, `${w.solar}° · ${flux} W/m²`)}
        ${metric('📡', 'Yer bağlantısı', commQ, `${commLabel(w.earth)}`)}
        ${metric('🚀', 'Yakıt marjini', propQ, `${w.dv===0?'Optimal':'+'+w.dv+' m/s'}`)}
        ${metric('⛰', 'Arazi kalitesi', terrainQ(c), `${c.slope}° · %${Math.round(c.rocks*100)} kaya`)}
      </div>
    `;
    grid.appendChild(card);
  });
}

function metric(icon, label, ratio, val) {
  const pct = Math.round(ratio * 100);
  const barCol = pct >= 75 ? 'var(--green)' : pct >= 50 ? 'var(--accent)' : pct >= 30 ? 'var(--amber)' : 'var(--red)';
  return `
    <div class="metric-row">
      <span class="metric-icon">${icon}</span>
      <span class="metric-label">${label}</span>
      <div class="metric-bar-wrap"><div class="metric-bar" style="width:${pct}%;background:${barCol}"></div></div>
      <span class="metric-val">${val.length > 12 ? val.substring(0,12) : val}</span>
    </div>`;
}

function terrainQ(c) {
  const sn = Math.max(0, 1 - c.slope / 12);
  const rn = Math.max(0, 1 - c.rough / 0.5);
  const kn = Math.max(0, 1 - c.rocks / 0.15);
  return sn * 0.5 + rn * 0.25 + kn * 0.25;
}

// ───────────────────────────────────────────────
//  RENDER: decision panel
// ───────────────────────────────────────────────
function renderDecision(c, winIdx) {
  const w   = ORBITAL_WINDOWS[winIdx];
  const eff = cachedEffs[winIdx];
  const bestIdx = cachedEffs.indexOf(Math.max(...cachedEffs));
  const col = effColor(eff);

  document.getElementById('dec-win-label').textContent = `${c.name} · ${w.label}`;
  const effEl = document.getElementById('dec-eff-num');
  effEl.textContent = `%${eff}`;
  effEl.style.color = col;

  // comparison chips
  const cmp = document.getElementById('dec-compare');
  cmp.innerHTML = ORBITAL_WINDOWS.map((ww, i) => {
    const e = cachedEffs[i];
    return `<div class="cmp-chip ${i===winIdx?'cmp-sel':''}" style="color:${effColor(e)}">${ww.label} %${e}</div>`;
  }).join('');

  document.getElementById('dec-explanation').innerHTML = buildExplanation(c, w, eff, winIdx, bestIdx);
  document.getElementById('decisionPanel').classList.add('visible');
}

// ───────────────────────────────────────────────
//  EXPLANATION GENERATOR (Turkish)
// ───────────────────────────────────────────────
function buildExplanation(c, w, eff, winIdx, bestIdx) {
  const flux   = solarFlux(w.solar);
  const lm     = parseFloat(linkMargin(w.earth));
  const isBest = winIdx === bestIdx;
  const otherEffs = cachedEffs.filter((_,i) => i !== winIdx);
  const avgOther = Math.round(otherEffs.reduce((a,b)=>a+b,0) / otherEffs.length);
  const diff = eff - avgOther;

  // Dominant limiting factor
  const solarQ = Math.min(1, w.solar / 3.5);
  const commQ  = Math.min(1, w.earth / 12);
  const propQ  = Math.max(0, 1 - w.dv / 60);
  const tQ     = terrainQ(c);
  const scores = {solar:solarQ, comm:commQ, prop:propQ, terrain:tQ};
  const minKey = Object.keys(scores).reduce((a,b)=>scores[a]<scores[b]?a:b);
  const maxKey = Object.keys(scores).reduce((a,b)=>scores[a]>scores[b]?a:b);

  const factorNames = {
    solar:'güneş ışınımı', comm:'yer iletişim geometrisi',
    prop:'yakıt marjini', terrain:'arazi güvenliği'
  };

  // Solar sentence
  let solar_s;
  if (w.solar >= 3.0)
    solar_s = `Güneş irtifasının <strong>${w.solar}°</strong> ile en yüksek seviyesinde olduğu bu pencerede güneş panelleri <strong>${flux} W/m²</strong> akı üretmekte ve iniş sonrası operasyonlar için yeterli enerji marjini sağlamaktadır.`;
  else if (w.solar >= 1.8)
    solar_s = `Güneş irtifasının <strong>${w.solar}°</strong> ile orta seviyede olduğu bu pencerede güneş panelleri <strong>${flux} W/m²</strong> akı üretmektedir; enerji marjini daralmış olmakla birlikte operasyonel limitler içindedir.`;
  else
    solar_s = `Güneş irtifası yalnızca <strong>${w.solar}°</strong> olan bu pencerede güneş akısı <em>${flux} W/m²</em> ile kısıtlıdır; iniş öncesi batarya tampon kapasitesinin tam dolumu zorunludur.`;

  // Comm sentence
  let comm_s;
  if (w.earth >= 10)
    comm_s = `Dünya <strong>${w.earth}°</strong> irtifada iken doğrudan LRS-1 bağlantısı <strong>+${lm} dBm</strong> marjinle aktif olup tüm telemetri ve komut kanalları güvenceli biçimde çalışacaktır.`;
  else if (w.earth >= 5)
    comm_s = `Dünya <strong>${w.earth}°</strong> irtifada olup link marjini <em>+${lm} dBm</em> ile marjinal doğrudan bağlantı sağlamaktadır; LRO röle desteği aktivasyon sınırında bekletilmelidir.`;
  else
    comm_s = `Dünya yalnızca <em>${w.earth}°</em> irtifada olduğundan bu pencerede yalnızca röle uydusu üzerinden iletişim kurulabilmektedir; bu durum komut gecikmesini yaklaşık <em>2.4 sn</em> artırmaktadır.`;

  // Propellant sentence
  let prop_s;
  if (w.dv === 0)
    prop_s = `<strong>${w.angle}°'lik</strong> iniş açısı minimum enerji yörüngesine birebir karşılık geldiğinden herhangi bir ek delta-V harcaması söz konusu değildir ve yakıt rezervi tam marjinini korumaktadır.`;
  else
    prop_s = `<strong>${w.angle}°'lik</strong> iniş açısı, minimum enerji yörüngesinden <em>+${w.dv} m/s</em> delta-V sapması gerektirmektedir; bu sapma yakıt rezervini daraltmakla birlikte operasyonel güvenlik sınırlarının dışına çıkmamaktadır.`;

  // Terrain sentence
  let terrain_s;
  if (c.slope <= 5)
    terrain_s = `Kraterin <strong>${c.slope}°'lik</strong> son derece düz arazisi ve düşük kaya yoğunluğu (<strong>%${Math.round(c.rocks*100)}</strong>), tüm pencerelerde arazi güvenliğini maksimum düzeyde tutmaktadır.`;
  else if (c.slope <= 10)
    terrain_s = `Kraterin <strong>${c.slope}°'lik</strong> orta eğimi kısıtlayıcı değildir; standart arazi doğrulama prosedürü yeterlidir.`;
  else
    terrain_s = `Kraterin <strong>${c.slope}°'lik</strong> yüksek eğimi arazi güvenlik marjini üzerinde baskı oluşturmaktadır; aktif tehlike kaçınma sistemi (HDA) tam kapasite devreye girecektir.`;

  // PSR science sentence
  let psr_s;
  if (c.psr >= 0.7)
    psr_s = `PSR erişim oranının <strong>%${Math.round(c.psr*100)}</strong> ile son derece yüksek olması, bilimsel getiri potansiyelini güney kutup adayları arasında zirveye taşımaktadır.`;
  else if (c.psr >= 0.4)
    psr_s = `PSR erişim oranı <strong>%${Math.round(c.psr*100)}</strong> ile orta-yüksek düzeyde olup temel uçucu madde araştırma hedeflerini karşılamaktadır.`;
  else
    psr_s = `PSR erişim oranı <strong>%${Math.round(c.psr*100)}</strong> ile nispeten düşük kalmaktadır; bu krater ağırlıklı olarak mühendislik demonstrasyon hedeflerine yöneliktir.`;

  // Comparison + verdict
  let verdict_s;
  if (isBest) {
    verdict_s = `Diğer üç pencereyle karşılaştırıldığında (ortalama <em>%${avgOther}</em>), <strong>${w.label}</strong> ${factorNames[maxKey]} avantajı nedeniyle <em>+${diff} puan</em> fark yaratmaktadır. Bu pencere, bu kratere iniş için en yüksek bütünleşik verimi sunmaktadır.`;
  } else {
    verdict_s = `Bu pencerede <em>${factorNames[minKey]}</em> birincil sınırlayıcı etkendir. En yüksek verimli pencereye kıyasla <em>${eff - Math.max(...cachedEffs)} puan</em> fark bulunmakta olup bu pencereyi tercih eden bir operatör, ${minKey==='solar'?'enerji marjinini daraltmayı':'iletişim güvenilirliğini kısmen düşürmeyi'} göze almalıdır.`;
  }

  return `${solar_s} ${comm_s} ${prop_s} ${terrain_s} ${psr_s} ${verdict_s}`;
}

// ───────────────────────────────────────────────
//  EVENTS
// ───────────────────────────────────────────────
function selectCrater(c) {
  selectedCrater = c;
  selectedWinIdx = null;
  document.getElementById('decisionPanel').classList.remove('visible');
  renderSidebar();
  renderCraterInfo(c);
  renderWindows(c);
}

function selectWindow(i) {
  if (!selectedCrater) return;
  selectedWinIdx = i;
  renderWindows(selectedCrater);  // re-render to highlight selected
  renderDecision(selectedCrater, i);
}

// ───────────────────────────────────────────────
//  INIT
// ───────────────────────────────────────────────
renderSidebar();
</script>
</body>
</html>
