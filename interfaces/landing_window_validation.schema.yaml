# status: draft
# owner: luna-ai-architecture
# depends_on: [interfaces/earth_visibility.schema.yaml, interfaces/multi_site_comparison.schema.yaml, power/, thermal/, communication/]
# open_items: [confidence calculation methodology TBD, link_budget_ok field tied to communication/ schema]

# Landing Window Validation Schema
# Landing time <-> GNC/power/thermal/communication validation contract
# Reference source: lunar-navigator when-to-land analysis

$schema: "https://json-schema.org/draft/2020-12"
title: LandingWindowValidation
description: >
  Multi-disciplinary validation product for the proposed landing window.
  Solar geometry, Earth visibility, power budget, thermal budget and communication conditions are checked.
  This schema provides input for operator approval — final landing time is GCA (aligned with B1-EK).

type: object
required:
  - window_id
  - window_start_utc
  - window_end_utc
  - sun_coverage_ok
  - earth_visibility_ok
  - power_budget_ok
  - thermal_budget_ok
  - comm_window_ok
  - overall_valid
  - confidence
  - temporal_class
  - source

properties:
  window_id:
    type: string
    description: Window identifier

  window_start_utc:
    type: string
    format: date-time
    description: Proposed landing window start (ISO 8601)

  window_end_utc:
    type: string
    format: date-time
    description: Proposed landing window end (ISO 8601)

  sun_coverage_ok:
    type: boolean
    description: Is sufficient solar illumination available for landing and initial post-landing operations?

  earth_visibility_ok:
    type: boolean
    description: >
      Is geometric Earth visibility adequate during the landing window?
      NOTE: Geometric visibility only — link budget (comm_window_ok) is evaluated separately.

  power_budget_ok:
    type: boolean
    description: Is the estimated power budget sufficient for HC-006 (return reserve) and initial operations?

  thermal_budget_ok:
    type: boolean
    description: Are post-landing thermal conditions within HC-007 (darkness tolerance)?

  comm_window_ok:
    type: boolean
    description: >
      Is communication link budget adequate during the landing window?
      This field comes from the link planning layer independently of geometric visibility (DR-INT-003).

  overall_valid:
    type: boolean
    description: True if all boolean checks are true. If false, the operator approval input has a blocking reason ambiguity.

  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: >
      Calculation confidence score (0.0–1.0). Marginal Earth visibility, low DEM resolution
      or worst-case energy uncertainty lowers the score.

  failure_reasons:
    type: array
    items:
      type: string
    description: List of failed checks if overall_valid=false

  temporal_class:
    type: string
    enum: [historical, predicted]
    description: B5-EK §7.2 policy

  ephemeris_validity_range:
    type: object
    description: Time range for which the calculation is valid. MANDATORY field (DR-INT-004).
    required: [start_utc, end_utc]
    properties:
      start_utc:
        type: string
        format: date-time
      end_utc:
        type: string
        format: date-time

  source:
    type: string
    description: Calculation source
    example: "repo:when-to-land"

additionalProperties: false
