# status: draft
# owner: luna-ai-architecture
# depends_on: [communication/, simulation/environment-model/]
# open_items: [marginal_elevation_threshold TBD-VIS-001, uncertainty_minutes methodology TBD]
# note: This schema defines geometric Earth visibility.
#       §4.7 communication link planning (data rate, queue, window assignment) is in a SEPARATE schema.
#       The two are not merged in the UI (DR-INT-003).

# Earth Visibility Schema
# Communication Management <-> Environment Model <-> Ground Control UI contract

$schema: "https://json-schema.org/draft/2020-12"
title: EarthVisibilityProduct
description: >
  Geometric Earth visibility product for a specific location and time.
  GEOMETRIC VISIBILITY ONLY (is Earth visible on the horizon).
  Link budget, data rate and window assignment are not included in this schema.

type: object
required:
  - site_id
  - observation_time_utc
  - observer_height_m
  - earth_visible
  - next_change_utc
  - longest_outage_hours
  - temporal_class
  - terrain_resolution
  - ephemeris_validity_range
  - source

properties:
  site_id:
    type: string
    description: Site identifier

  observation_time_utc:
    type: string
    format: date-time
    description: Observation time (ISO 8601)

  observer_height_m:
    type: number
    minimum: 0
    description: >
      Antenna/sensor mast height (metres).
      TBD-HEIGHT-001 — aligned with SC-009 observer height sensitivity.

  earth_visible:
    type: boolean
    description: Is Earth currently geometrically above the horizon?

  earth_elevation_deg:
    type: number
    description: >
      Elevation angle of Earth relative to local horizon (degrees).
      Negative = below horizon.

  next_change_utc:
    type: string
    format: date-time
    description: Time of next visibility change (visible→invisible or vice versa)

  longest_outage_hours:
    type: number
    minimum: 0
    description: Longest communication outage calculated from this location (hours) — SC-007 parameter

  uncertainty_minutes:
    type: integer
    minimum: 0
    description: >
      Visibility change time uncertainty (minutes).
      Includes Earth eclipse refraction and horizon profile sensitivity (B5-EK §7.1).

  confidence:
    type: string
    enum: [HIGH, LOW]
    description: >
      LOW: earth_elevation_deg < TBD-VIS-001 threshold (marginal window).
      Aligned with B3-EK RR-014 and B5-EK §7.1.

  temporal_class:
    type: string
    enum: [historical, predicted]
    description: >
      historical: observation time is past — exact geometry.
      predicted: observation time is future — calculated geometry, uncertainty margin applied.
      B5-EK §7.2 policy.

  terrain_resolution:
    type: string
    enum: ["80m", "300m", "2700m"]
    description: >
      DEM resolution used in horizon calculation.
      MANDATORY field — not hidden (DR-INT-004). Aligned with B3-EK RR-011/RR-015.

  ephemeris_validity_range:
    type: object
    description: >
      Time range for which this calculation is valid.
      MANDATORY field — not hidden (DR-INT-004). RR-012: repo valid for 2024–2035 only.
    required: [start_utc, end_utc]
    properties:
      start_utc:
        type: string
        format: date-time
      end_utc:
        type: string
        format: date-time

  source:
    type: string
    description: Calculation source (e.g. "repo:pipeline/ephem/")
    example: "repo:pipeline/ephem/"

additionalProperties: false
