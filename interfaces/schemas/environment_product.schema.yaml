# status: draft
# owner: luna-ai-architecture
# depends_on: [docs/conops/CONOPS.md §4.2, docs/conops/CONOPS.md §6, domain/mission/constraints/hard_constraints_catalog.yaml]
# open_items: [resolution_m tied to vehicle sensor capability TBD(source: §10), coverage_area beyond repo boundary global TBD]

schema_version: "1.0.0"
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "EnvironmentProduct"
description: >
  Contract defining an environmental data product (terrain, thermal, illumination,
  PSR boundary, navigation map, etc.). All environment data must satisfy this schema.

type: object

required:
  - product_id
  - product_type
  - source
  - timestamp_utc
  - coordinate_reference_system
  - resolution_m
  - quality_score
  - uncertainty_1sigma
  - temporal_class
  - processing_version
  - lineage
  - schema_version
  - ephemeris_validity_range
  - terrain_resolution
  - coverage_area

properties:

  schema_version:
    type: string
    description: "Version of this schema. Updated according to VERSIONING.md rules."
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"

  product_id:
    type: string
    description: "UUID or mission-specific ID uniquely identifying the product."
    minLength: 1

  product_type:
    type: string
    description: "Product type. Defined values are extensible (requires MINOR bump)."
    enum:
      - terrain_slope
      - terrain_roughness
      - obstacle_map
      - illumination_map
      - psr_boundary
      - thermal_map
      - navigation_map
      - hazard_map

  source:
    type: string
    description: "Data source (e.g. 'LRO/LROC', 'synthetic_sim_v2', 'onboard_lidar')."
    minLength: 1

  timestamp_utc:
    type: string
    format: date-time
    description: "Data validity timestamp (ISO-8601, UTC). For historical data: observation time."

  coordinate_reference_system:
    type: string
    description: "Coordinate reference system. E.g.: 'MOON_ME_DE421', 'LOLA_POLAR_STEREO_N'."
    minLength: 1

  resolution_m:
    type: number
    description: "Spatial resolution (metres/pixel). Tied to vehicle sensor capability — TBD(source: §10)."
    exclusiveMinimum: 0

  quality_score:
    type: number
    description: "Data quality score [0.0, 1.0]. 0=unusable, 1=perfect."
    minimum: 0.0
    maximum: 1.0

  uncertainty_1sigma:
    type: number
    description: >
      1σ uncertainty value. Null not accepted — if unmeasured or unknown, marked as -1.
      A negative value indicates uncertainty is unknown; planner applies conservative margin.
    not:
      type: "null"

  temporal_class:
    type: string
    description: >
      Temporal class. 'historical' = past observation (occurred, fixed),
      'predicted' = future estimate (produced from model, may be updated).
      Supports v1.0 §4.2 and §6 illumination distinction. Never mixed.
    enum:
      - historical
      - predicted

  processing_version:
    type: string
    description: "Version of the processing pipeline that produced the data. Mandatory for reproducibility."
    minLength: 1

  lineage:
    type: string
    description: "Data provenance description — from which raw data, through which processing, it was derived."
    minLength: 1

  # ── A2-EK: Mandatory new fields (source: lunar-navigator DATA_CONTRACT) ────────

  ephemeris_validity_range:
    type: object
    description: >
      Time range for which ephemeris data is valid.
      Repo limit: 2024-01-01 – 2035-12-31 (SPICE DE440 coverage).
      No estimates outside this range; product is rejected.
    required: [start, end]
    properties:
      start:
        type: string
        format: date
        description: "Ephemeris validity start (YYYY-MM-DD)."
      end:
        type: string
        format: date
        description: "Ephemeris validity end (YYYY-MM-DD)."
    example:
      start: "2024-01-01"
      end: "2035-12-31"

  terrain_resolution:
    type: string
    description: >
      Terrain data resolution.
      80m = high resolution (detailed area analysis),
      300m = site finder resolution,
      2700m = global overview.
      Resolution is not hidden — planner knows which resolution it is working with.
      Compliance Note 7: Resolution limits are mandatory fields in A2.
    enum:
      - "80m"
      - "300m"
      - "2700m"

  coverage_area:
    type: string
    description: >
      Data coverage description.
      Detailed coverage from repo: 80°S–90°S (high-resolution region).
      Outside this region: global (low resolution, 2700m).
      Planner does not make definitive landing decisions outside coverage.
    minLength: 1
    examples:
      - "80S-90S: high-resolution (80m); outside: global (2700m)"
      - "global: 2700m"

  # ── Existing optional fields ───────────────────────────────────────────────────

  coverage_extent:
    type: object
    description: "Geographic coverage (optional)."
    properties:
      min_lat_deg: { type: number }
      max_lat_deg: { type: number }
      min_lon_deg: { type: number }
      max_lon_deg: { type: number }

  validity_window:
    type: object
    description: "Time range for which the data is valid (mandatory for predicted products)."
    properties:
      start_utc: { type: string, format: date-time }
      end_utc:   { type: string, format: date-time }

additionalProperties: false

# ── Populated Example — PSR Boundary Product ─────────────────────────────────
example:
  schema_version: "1.0.0"
  product_id: "PSR-BOUNDARY-HAWORTH-20260901T000000Z"
  product_type: "psr_boundary"
  source: "LRO/LROC_NAC"
  timestamp_utc: "2026-09-01T00:00:00Z"
  coordinate_reference_system: "LOLA_POLAR_STEREO_S"
  resolution_m: 2.0
  quality_score: 0.87
  uncertainty_1sigma: 3.5          # 1σ boundary uncertainty in metres
  temporal_class: "historical"      # Derived from past LRO observation
  processing_version: "psr_pipeline_v2.1.0"
  lineage: "Mosaic of 48 LRO/LROC NAC passes from 2024-2026; threshold: average illumination < 0.1%"
  coverage_extent:
    min_lat_deg: -88.0
    max_lat_deg: -86.0
    min_lon_deg: -5.0
    max_lon_deg: 10.0
