# status: draft
# owner: luna-ai-architecture
# depends_on:
#   - domain/mission/phase_state_machine.md
#   - domain/mission/constraints/hard_constraints_catalog.yaml
#   - docs/architecture/SAFETY_STATE_MACHINE.md
# open_items:
#   - timeout_s default values TBD(source: §10 vehicle response time)
#   - abort command parameter details TBD

schema_version: "1.0.0"
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "VehicleCommand"
description: >
  Command contract sent from ground segment to vehicle, or from FDIR to vehicle.
  Every command carries an ID, type, authority level and timeout.

type: object

required:
  - schema_version
  - command_id
  - command_type
  - authority_level
  - timestamp_utc
  - timeout_s

properties:

  schema_version:
    type: string
    description: "Version of this schema."
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"

  command_id:
    type: string
    description: "ID uniquely identifying the command (UUID or mission-seq)."
    minLength: 1

  command_type:
    type: string
    description: >
      Command type.
      route_change: route update.
      science_target_abandon: abandon science objective.
      psr_entry: start PSR operation (after HC checklist completed).
      safe_haven_change: update safe haven coordinates.
      emergency_return: trigger emergency return.
      instrument_toggle: enable/disable science instrument.
      mode_change: change power mode.
      abort: stop mission and move to safe position.
    enum:
      - route_change
      - science_target_abandon
      - psr_entry
      - safe_haven_change
      - emergency_return
      - instrument_toggle
      - mode_change
      - abort

  authority_level:
    type: string
    description: >
      Authority level of the command.
      ground_approved: ground operations centre approved; nominal ops.
      autonomous: produced within vehicle's own decision-making framework.
      emergency_autonomous: decisions produced by FDIR when uplink is lost.
        Vehicle automatically activates emergency_autonomous authority on link loss.
    enum:
      - ground_approved
      - autonomous
      - emergency_autonomous

  timestamp_utc:
    type: string
    format: date-time
    description: "Command generation time (UTC)."

  timeout_s:
    type: number
    description: >
      Command timeout (seconds). If vehicle cannot execute command within this period,
      it rejects it and remains in previous safe state.
      TBD(source: §10 vehicle response time).
    exclusiveMinimum: 0

  sequence_number:
    type: integer
    description: "Command sequence number (optional). Used for replay detection."
    minimum: 0

  supersedes_command_id:
    type: string
    description: "Previous command ID that this command cancels (optional)."

  parameters:
    type: object
    description: "Command-specific parameters. Content varies by command_type."
    properties:

      # route_change
      waypoints:
        type: array
        description: "New route waypoints."
        items:
          type: object
          required: [lat_deg, lon_deg]
          properties:
            lat_deg: { type: number }
            lon_deg: { type: number }
            alt_m:   { type: number }

      # safe_haven_change
      new_safe_haven:
        type: object
        description: "New safe haven coordinates."
        properties:
          lat_deg:      { type: number }
          lon_deg:      { type: number }
          candidate_id: { type: string }

      # instrument_toggle
      instrument_id:
        type: string
        description: "ID of instrument to enable/disable."
      instrument_state:
        type: string
        enum: [on, off, standby]

      # mode_change
      target_power_mode:
        type: string
        enum: [full_operation, science_restricted, traverse_only, survival]

      # psr_entry — checklist reference
      psr_entry_checklist_complete:
        type: boolean
        description: >
          Confirmation that the mandatory checklist before PSR_OPS entry in
          phase_state_machine.md has been completed. If false, psr_entry command is rejected.

      # abort
      abort_destination:
        type: string
        enum: [safe_haven_primary, safe_haven_secondary, landing_site, hold_in_place]

additionalProperties: false

example:
  schema_version: "1.0.0"
  command_id: "CMD-20261005-142201-PSR"
  command_type: psr_entry
  authority_level: ground_approved
  timestamp_utc: "2026-10-05T14:22:01Z"
  timeout_s: 120
  sequence_number: 47
  parameters:
    psr_entry_checklist_complete: true
