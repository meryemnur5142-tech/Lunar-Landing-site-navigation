# status: draft
# owner: luna-ai-architecture
# depends_on:
#   - interfaces/schemas/environment_product.schema.yaml  (terrain_resolution, ephemeris_validity_range)
#   - domain/mission/constraints/hard_constraints_catalog.yaml  (HC-016, HC-017)
# open_items:
#   - max_regions count 5 (expanded from repo 2-3; upper limit TBD)
#   - threshold values taken from HC-016/HC-017, TBD(source: §10)

schema_version: "1.0.0"
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "MultiSiteGeometryProduct"
description: >
  Product comparing sun/Earth/night/outage metrics for multiple regions.
  Source: daniel27-space/lunar-navigator multi-region comparison module (repo: 2-3 regions → LUNA-AI: 5 regions).
  This product is used as a ranking input after HC-016/HC-017 hard constraint elimination.
  Compliance Note 5: Metrics in this product do not make safety decisions on their own.

type: object

required:
  - schema_version
  - analysis_epoch_start_utc
  - analysis_epoch_end_utc
  - analysis_duration_days
  - terrain_resolution
  - regions
  - source

properties:

  schema_version:
    type: string
    description: "Version of this schema."
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"

  analysis_epoch_start_utc:
    type: string
    format: date-time
    description: "Analysis start time (UTC)."

  analysis_epoch_end_utc:
    type: string
    format: date-time
    description: "Analysis end time (UTC)."

  analysis_duration_days:
    type: integer
    description: "Analysis duration (days). Repo reference: 60 days."
    minimum: 1

  terrain_resolution:
    type: string
    description: "Terrain resolution. Repo site finder: 300m."
    enum: ["80m", "300m", "2700m"]

  ephemeris_validity_range:
    type: object
    description: "Ephemeris range for which this analysis is valid."
    properties:
      start: { type: string, format: date }
      end:   { type: string, format: date }

  regions:
    type: array
    description: >
      Compared regions. Repo: 2-3; LUNA-AI: expanded to 5 regions.
      Sun fraction, Earth fraction, longest night, longest outage calculated for each region.
    minItems: 1
    maxItems: 5
    items:
      type: object
      required:
        - region_id
        - lat_deg
        - lon_deg
        - sun_fraction
        - earth_fraction
        - longest_night_hours
        - longest_outage_hours
        - hc016_pass
        - hc017_pass
      properties:
        region_id:
          type: string
          description: "Region identifier."

        lat_deg:
          type: number
          minimum: -90
          maximum: 90

        lon_deg:
          type: number
          minimum: -180
          maximum: 180

        sun_fraction:
          type: number
          description: "Solar visibility fraction during analysis period [0,1]."
          minimum: 0.0
          maximum: 1.0

        earth_fraction:
          type: number
          description: "Earth visibility fraction during analysis period [0,1]."
          minimum: 0.0
          maximum: 1.0

        longest_night_hours:
          type: number
          description: "Longest night duration during analysis period (hours). Related to HC-010."
          minimum: 0.0

        longest_outage_hours:
          type: number
          description: "Longest communication outage during analysis period (hours). Related to HC-014."
          minimum: 0.0

        hc016_pass:
          type: boolean
          description: "HC-016 (min sun fraction) elimination result. false → region eliminated."

        hc017_pass:
          type: boolean
          description: "HC-017 (min Earth visibility fraction) elimination result. false → region eliminated."

        ranking_score:
          type: number
          description: >
            Multi-criteria ranking score (optional). Applied only to regions that pass HC.
            Compliance Note 5: This score does not make safety decisions on its own.
          minimum: 0.0
          maximum: 1.0

        notes:
          type: string

  source:
    type: string
    description: "Data source."
    minLength: 1

additionalProperties: false

example:
  schema_version: "1.0.0"
  analysis_epoch_start_utc: "2026-10-01T00:00:00Z"
  analysis_epoch_end_utc: "2026-11-30T00:00:00Z"
  analysis_duration_days: 60
  terrain_resolution: "300m"
  ephemeris_validity_range:
    start: "2024-01-01"
    end: "2035-12-31"
  source: "lunar-navigator multi-site comparator (expanded 2→5 regions)"
  regions:
    - region_id: "HAWORTH-RIDGE-A"
      lat_deg: -87.42
      lon_deg: 2.15
      sun_fraction: 0.82
      earth_fraction: 0.71
      longest_night_hours: 72.3
      longest_outage_hours: 18.5
      hc016_pass: true
      hc017_pass: true
      ranking_score: 0.78
    - region_id: "NOBILE-RIM-B"
      lat_deg: -85.1
      lon_deg: 58.3
      sun_fraction: 0.61
      earth_fraction: 0.44
      longest_night_hours: 110.0
      longest_outage_hours: 42.0
      hc016_pass: false
      hc017_pass: false
      notes: "HC-016 and HC-017 failed; region eliminated"
