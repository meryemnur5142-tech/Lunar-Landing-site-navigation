# status: draft
# owner: luna-ai-architecture
# depends_on:
#   - interfaces/schemas/earth_visibility_windows.schema.yaml
#   - interfaces/schemas/resource_state.schema.yaml
#   - domain/mission/constraints/hard_constraints_catalog.yaml  (HC-018)
#   - domain/mission/phase_state_machine.md  (LANDING phase entry conditions)
# open_items:
#   - recommended_window calculation model TBD(source: §10 vehicle GNC capability)
#   - confidence threshold TBD — below what confidence level is landing rejected

schema_version: "1.0.0"
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "LandingWindowProduct"
description: >
  Landing time recommendation product.
  Source: daniel27-space/lunar-navigator "when-to-land" module (7/14/30 days).
  This is an input for HC-018 landing time hard constraint validation.
  This product is referenced for phase_state_machine.md LANDING phase entry conditions
  "landing_window_validated: true" and "earth_visibility_confirmed: true".

type: object

required:
  - schema_version
  - product_id
  - recommended_window_start
  - recommended_window_end
  - confidence
  - basis
  - earth_visibility_confirmed
  - source

properties:

  schema_version:
    type: string
    description: "Version of this schema."
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"

  product_id:
    type: string
    description: "Product identifier."
    minLength: 1

  generated_utc:
    type: string
    format: date-time
    description: "Time this recommendation product was generated (UTC)."

  recommended_window_start:
    type: string
    format: date-time
    description: "Recommended landing window start (UTC)."

  recommended_window_end:
    type: string
    format: date-time
    description: "Recommended landing window end (UTC)."

  confidence:
    type: number
    description: >
      Recommendation confidence score [0.0, 1.0].
      1.0 = all criteria fully met; 0.0 = no suitable window found.
      Planner rejects landing if confidence < threshold (threshold TBD).
    minimum: 0.0
    maximum: 1.0

  basis:
    type: array
    description: >
      Criteria on which this recommendation is based.
      Possible values: sun_coverage, earth_visibility, thermal, fuel_budget.
    items:
      type: string
      enum:
        - sun_coverage
        - earth_visibility
        - thermal
        - fuel_budget
    minItems: 1
    uniqueItems: true

  earth_visibility_confirmed:
    type: boolean
    description: >
      Is Earth visibility confirmed during the recommended window?
      Mandatory validation field for HC-018 hard constraint.
      If false, LANDING phase transition is rejected.

  source:
    type: string
    description: "Data source. Expected: 'lunar-navigator/when-to-land'"
    minLength: 1

  analysis_horizon_days:
    type: integer
    description: "Number of days ahead the analysis looks. Repo: 7, 14 or 30 days."
    enum: [7, 14, 30]

  alternative_windows:
    type: array
    description: "Alternative windows evaluated outside the recommended window (optional)."
    items:
      type: object
      required: [start_utc, end_utc, confidence, earth_visible]
      properties:
        start_utc:    { type: string, format: date-time }
        end_utc:      { type: string, format: date-time }
        confidence:   { type: number, minimum: 0.0, maximum: 1.0 }
        earth_visible:{ type: boolean }
        notes:        { type: string }

  ephemeris_validity_range:
    type: object
    description: "Ephemeris range on which this estimate is based."
    properties:
      start: { type: string, format: date }
      end:   { type: string, format: date }

additionalProperties: false

example:
  schema_version: "1.0.0"
  product_id: "LWPROD-2026-10-01-30D"
  generated_utc: "2026-10-01T06:00:00Z"
  recommended_window_start: "2026-10-05T10:00:00Z"
  recommended_window_end: "2026-10-05T14:00:00Z"
  confidence: 0.91
  basis:
    - sun_coverage
    - earth_visibility
    - thermal
  earth_visibility_confirmed: true
  source: "lunar-navigator/when-to-land"
  analysis_horizon_days: 30
  ephemeris_validity_range:
    start: "2024-01-01"
    end: "2035-12-31"
  alternative_windows:
    - start_utc: "2026-10-12T08:00:00Z"
      end_utc:   "2026-10-12T12:00:00Z"
      confidence: 0.74
      earth_visible: true
      notes: "Lower solar angle; reduced thermal margin"
