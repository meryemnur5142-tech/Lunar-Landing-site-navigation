# status: draft
# owner: luna-ai-architecture
# depends_on:
#   - domain/mission/constraints/hard_constraints_catalog.yaml  (HC-014, HC-017, HC-018)
#   - safety/safety_budget.md  (§6 max_communication_outage_hours)
# open_items:
#   - uncertainty_minutes tied to vehicle hardware latency TBD(source: §10)
#   - longest_outage_duration_hours operational threshold to be determined with §10 hardware data

schema_version: "1.0.0"
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "EarthVisibilityWindows"
description: >
  Earth visibility window data from the vehicle.
  Source: daniel27-space/lunar-navigator pipeline/ephem/ (SPICE DE440).
  This data is used in HC-014 and HC-018 hard constraint checks, and A4 safety_budget §6.
  Compliance Note 6: "Is Earth visible on the horizon" (this schema) ≠ communication link planning (§4.7).
  Visibility is a necessary condition; link quality and transmission rate are evaluated separately.

type: object

required:
  - schema_version
  - timestamp_utc
  - earth_visible
  - next_change_time
  - longest_outage_duration_hours
  - uncertainty_minutes
  - source

properties:

  schema_version:
    type: string
    description: "Version of this schema."
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"

  timestamp_utc:
    type: string
    format: date-time
    description: "Time this visibility estimate was produced (UTC)."

  earth_visible:
    type: boolean
    description: >
      Instantaneous Earth visibility. true = Earth is visible on/above the horizon.
      Used in HC-018 landing time validation.

  next_change_time:
    type: string
    format: date-time
    description: "Time of the next visibility change (UTC). Used by planner for window calculation."

  longest_outage_duration_hours:
    type: number
    description: >
      Longest communication outage in the upcoming 60-day window (hours).
      Source: lunar-navigator 60-day sun/Earth window analysis,
      "longest night/communication gap" metric.
      Compared against safety_budget.md §6 max_communication_outage_hours.
      TBD(source: §10 — operational threshold depends on hardware data).
    minimum: 0.0

  uncertainty_minutes:
    type: integer
    description: >
      Visibility boundary prediction uncertainty (minutes).
      Source: lunar-navigator ephemeris accuracy.
      TBD(source: §10 vehicle hardware latency + antenna angle tolerance).
    minimum: 0

  source:
    type: string
    description: "Data source. Expected: 'lunar-navigator/pipeline/ephem/ SPICE DE440'"
    minLength: 1

  visibility_windows_next_7days:
    type: array
    description: "List of visibility windows for the upcoming 7 days (optional; planning convenience)."
    items:
      type: object
      required: [start_utc, end_utc, duration_hours]
      properties:
        start_utc:      { type: string, format: date-time }
        end_utc:        { type: string, format: date-time }
        duration_hours: { type: number, minimum: 0 }

  ephemeris_validity_range:
    type: object
    description: "Ephemeris range for which this estimate is valid."
    properties:
      start: { type: string, format: date }
      end:   { type: string, format: date }

additionalProperties: false

example:
  schema_version: "1.0.0"
  timestamp_utc: "2026-10-05T12:00:00Z"
  earth_visible: true
  next_change_time: "2026-10-06T03:17:00Z"
  longest_outage_duration_hours: 11.4
  uncertainty_minutes: 8
  source: "lunar-navigator/pipeline/ephem/ SPICE DE440"
  ephemeris_validity_range:
    start: "2024-01-01"
    end: "2035-12-31"
