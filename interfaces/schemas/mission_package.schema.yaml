# status: draft
# owner: luna-ai-architecture
# depends_on:
#   - domain/mission/constraints/hard_constraints_catalog.yaml
#   - domain/mission/phase_state_machine.md
#   - docs/adr/ADR-001..ADR-006
# open_items:
#   - safe_haven_candidates min sayısı TBD(source: §10 görev tasarımı)
#   - return_condition sayısal eşikler TBD(source: §10)

schema_version: "1.0.0"
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "MissionPackage"
description: >
  Yer segmentinin araca gönderdiği görev paketi sözleşmesi.
  Aktif hard constraint listesini, safe haven adaylarını ve dönüş koşulunu içerir.

type: object

required:
  - schema_version
  - package_id
  - version
  - objectives
  - active_hard_constraints
  - safe_haven_candidates
  - return_condition
  - authority_level

properties:

  schema_version:
    type: string
    description: "Bu şemanın versiyonu."
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"

  package_id:
    type: string
    description: "Görev paketini benzersiz olarak tanımlayan ID."
    minLength: 1

  version:
    type: string
    description: "Bu görev paketinin versiyonu (yer operasyon merkezi iter)."
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"

  created_utc:
    type: string
    format: date-time
    description: "Paketin oluşturulma zamanı (UTC)."

  valid_until_utc:
    type: string
    format: date-time
    description: "Paketin geçerlilik süresi. Araç bu süreden sonra paketi reddeder."

  objectives:
    type: array
    description: "Görev hedefleri. Her hedef ID ve öncelik içerir."
    minItems: 1
    items:
      type: object
      required: [objective_id, priority, description]
      properties:
        objective_id:  { type: string }
        priority:
          type: string
          enum: [mandatory, high, medium, low]
        description:   { type: string }

  active_hard_constraints:
    type: array
    description: >
      Bu görev paketi için etkin hard constraint ID listesi.
      hard_constraints_catalog.yaml'dan seçilir. HC-XXX formatı zorunlu.
      Planlayıcı bu listedeki kısıtları eleme aşamasında uygular (Uyum Notu 5).
    items:
      type: string
      pattern: "^HC-[0-9]{3}$"
    minItems: 1
    uniqueItems: true

  safe_haven_candidates:
    type: array
    description: >
      Öncelik sırasına göre safe haven aday koordinatları.
      Her aday HC-009..HC-015 kriterlerini karşılamalıdır.
    minItems: 1
    items:
      type: object
      required: [candidate_id, lat_deg, lon_deg, evaluation_status]
      properties:
        candidate_id:        { type: string }
        lat_deg:             { type: number, minimum: -90, maximum: 90 }
        lon_deg:             { type: number, minimum: -180, maximum: 180 }
        priority_rank:       { type: integer, minimum: 1 }
        evaluation_status:
          type: string
          enum: [approved, provisional, rejected]
        notes:               { type: string }

  return_condition:
    type: object
    description: >
      Araçın dönüş kararını tetikleyen koşullar. Araç bu koşullar karşılandığında
      planlayıcı otomatik RETURN fazına geçer.
    required: [trigger_type]
    properties:
      trigger_type:
        type: string
        enum:
          - reserve_threshold      # return_reserve_wh <= HC-006
          - time_limit             # görev_süresi >= limit
          - science_complete       # tüm hedefler tamamlandı
          - emergency              # FDIR tetikledi
          - ground_command         # yer komutu
      reserve_threshold_wh:
        type: number
        description: "HC-006 eşiği (Power Mgmt belirler). TBD(source: §10)"
      time_limit_s:
        type: number
        description: "Zaman bazlı dönüş koşulu (saniye)."

  authority_level:
    type: string
    description: >
      Bu paketin otorite seviyesi.
      ground_approved: yer segmenti onaylı nominal ops.
      autonomous: araç bağımsız karar verebilir (parametreler içinde).
      emergency_autonomous: link kesilince FDIR kararları aktif.
    enum:
      - ground_approved
      - autonomous
      - emergency_autonomous

  contingency_plan:
    type: object
    description: "Kriz senaryosu protokolleri (opsiyonel; docs/conops/CONOPS.md §kriz ile uyumlu)."
    properties:
      link_loss_action:
        type: string
        enum: [continue_to_safe_haven, abort_to_landing_site, hold_in_place]
      power_critical_action:
        type: string
        enum: [immediate_return, reduce_science, survival_mode]

additionalProperties: false

example:
  schema_version: "1.0.0"
  package_id: "MPKG-2026-10-05-001"
  version: "2.1.0"
  created_utc: "2026-10-05T08:00:00Z"
  valid_until_utc: "2026-10-07T08:00:00Z"
  objectives:
    - objective_id: "OBJ-PSR-HAWORTH-01"
      priority: mandatory
      description: "Haworth krateri PSR güney sektörü su buzu spektral analizi"
    - objective_id: "OBJ-REGOLITH-02"
      priority: high
      description: "PSR sınır bölgesi regolith numune noktaları (3 nokta)"
  active_hard_constraints:
    - HC-001
    - HC-003
    - HC-006
    - HC-007
    - HC-008
    - HC-009
    - HC-010
    - HC-011
    - HC-012
    - HC-013
    - HC-014
    - HC-015
  safe_haven_candidates:
    - candidate_id: "SH-RIDGE-ALPHA"
      lat_deg: -87.42
      lon_deg: 2.15
      priority_rank: 1
      evaluation_status: approved
      notes: "10+ saat/sol aydınlanma; relay görüş açısı 22°"
    - candidate_id: "SH-CRATER-RIM-BETA"
      lat_deg: -87.65
      lon_deg: 3.80
      priority_rank: 2
      evaluation_status: provisional
      notes: "HC-010 marjinal; kesinleştirme bekliyor"
  return_condition:
    trigger_type: reserve_threshold
    reserve_threshold_wh: 95.0
  authority_level: ground_approved
