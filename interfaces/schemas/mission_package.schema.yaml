# status: draft
# owner: luna-ai-architecture
# depends_on:
#   - domain/mission/constraints/hard_constraints_catalog.yaml
#   - domain/mission/phase_state_machine.md
#   - docs/adr/ADR-001..ADR-006
# open_items:
#   - safe_haven_candidates min count TBD(source: §10 mission design)
#   - return_condition numerical thresholds TBD(source: §10)

schema_version: "1.0.0"
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "MissionPackage"
description: >
  Contract for the mission package sent from the ground segment to the vehicle.
  Contains the active hard constraint list, safe haven candidates, and return condition.

type: object

required:
  - schema_version
  - package_id
  - version
  - objectives
  - active_hard_constraints
  - safe_haven_candidates
  - return_condition
  - authority_level

properties:

  schema_version:
    type: string
    description: "Version of this schema."
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"

  package_id:
    type: string
    description: "ID uniquely identifying the mission package."
    minLength: 1

  version:
    type: string
    description: "Version of this mission package (incremented by ground operations centre)."
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"

  created_utc:
    type: string
    format: date-time
    description: "Package creation time (UTC)."

  valid_until_utc:
    type: string
    format: date-time
    description: "Package validity period. Vehicle rejects the package after this time."

  objectives:
    type: array
    description: "Mission objectives. Each objective contains an ID and priority."
    minItems: 1
    items:
      type: object
      required: [objective_id, priority, description]
      properties:
        objective_id:  { type: string }
        priority:
          type: string
          enum: [mandatory, high, medium, low]
        description:   { type: string }

  active_hard_constraints:
    type: array
    description: >
      List of active hard constraint IDs for this mission package.
      Selected from hard_constraints_catalog.yaml. HC-XXX format required.
      Planner applies constraints in this list at the elimination stage (Compliance Note 5).
    items:
      type: string
      pattern: "^HC-[0-9]{3}$"
    minItems: 1
    uniqueItems: true

  safe_haven_candidates:
    type: array
    description: >
      Safe haven candidate coordinates in priority order.
      Each candidate must meet HC-009..HC-015 criteria.
    minItems: 1
    items:
      type: object
      required: [candidate_id, lat_deg, lon_deg, evaluation_status]
      properties:
        candidate_id:        { type: string }
        lat_deg:             { type: number, minimum: -90, maximum: 90 }
        lon_deg:             { type: number, minimum: -180, maximum: 180 }
        priority_rank:       { type: integer, minimum: 1 }
        evaluation_status:
          type: string
          enum: [approved, provisional, rejected]
        notes:               { type: string }

  return_condition:
    type: object
    description: >
      Conditions that trigger the vehicle's return decision. When these conditions are met,
      the planner automatically transitions to RETURN phase.
    required: [trigger_type]
    properties:
      trigger_type:
        type: string
        enum:
          - reserve_threshold      # return_reserve_wh <= HC-006
          - time_limit             # mission_duration >= limit
          - science_complete       # all objectives completed
          - emergency              # FDIR triggered
          - ground_command         # ground command
      reserve_threshold_wh:
        type: number
        description: "HC-006 threshold (determined by Power Mgmt). TBD(source: §10)"
      time_limit_s:
        type: number
        description: "Time-based return condition (seconds)."

  authority_level:
    type: string
    description: >
      Authority level of this package.
      ground_approved: ground-segment-approved nominal ops.
      autonomous: vehicle can make independent decisions (within parameters).
      emergency_autonomous: FDIR decisions active when link is lost.
    enum:
      - ground_approved
      - autonomous
      - emergency_autonomous

  contingency_plan:
    type: object
    description: "Crisis scenario protocols (optional; aligned with docs/conops/CONOPS.md §crisis)."
    properties:
      link_loss_action:
        type: string
        enum: [continue_to_safe_haven, abort_to_landing_site, hold_in_place]
      power_critical_action:
        type: string
        enum: [immediate_return, reduce_science, survival_mode]

additionalProperties: false

example:
  schema_version: "1.0.0"
  package_id: "MPKG-2026-10-05-001"
  version: "2.1.0"
  created_utc: "2026-10-05T08:00:00Z"
  valid_until_utc: "2026-10-07T08:00:00Z"
  objectives:
    - objective_id: "OBJ-PSR-HAWORTH-01"
      priority: mandatory
      description: "Haworth crater PSR south sector water ice spectral analysis"
    - objective_id: "OBJ-REGOLITH-02"
      priority: high
      description: "PSR boundary region regolith sample points (3 points)"
  active_hard_constraints:
    - HC-001
    - HC-003
    - HC-006
    - HC-007
    - HC-008
    - HC-009
    - HC-010
    - HC-011
    - HC-012
    - HC-013
    - HC-014
    - HC-015
  safe_haven_candidates:
    - candidate_id: "SH-RIDGE-ALPHA"
      lat_deg: -87.42
      lon_deg: 2.15
      priority_rank: 1
      evaluation_status: approved
      notes: "10+ hrs/sol illumination; relay line-of-sight angle 22°"
    - candidate_id: "SH-CRATER-RIM-BETA"
      lat_deg: -87.65
      lon_deg: 3.80
      priority_rank: 2
      evaluation_status: provisional
      notes: "HC-010 marginal; awaiting confirmation"
  return_condition:
    trigger_type: reserve_threshold
    reserve_threshold_wh: 95.0
  authority_level: ground_approved
