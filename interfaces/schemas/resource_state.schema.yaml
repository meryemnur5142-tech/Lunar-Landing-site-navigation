# status: draft
# owner: luna-ai-architecture
# depends_on:
#   - domain/mission/constraints/hard_constraints_catalog.yaml  (HC-006, HC-007, HC-008)
#   - safety/safety_budget.md
# open_items:
#   - return_reserve_wh calculation model TBD(source: §10 Power Mgmt vehicle parameters)
#   - thermal_margin_c critical component list TBD(source: §10)

schema_version: "1.0.0"
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "ResourceState"
description: >
  Vehicle energy and thermal state contract.
  Power Management module produces this message; planner consumes it as hard constraints.
  Compliance Note 3: Planner never calculates return_reserve_wh independently.

type: object

required:
  - schema_version
  - timestamp_sclk
  - state_of_charge_pct
  - available_energy_wh
  - return_reserve_wh
  - uncertainty_available_wh
  - power_mode
  - thermal_margin_c

properties:

  schema_version:
    type: string
    description: "Version of this schema."
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"

  timestamp_sclk:
    type: number
    description: "Spacecraft Clock (SCLK) timestamp — in seconds."
    minimum: 0

  timestamp_utc:
    type: string
    format: date-time
    description: "UTC equivalent (optional; logging convenience)."

  state_of_charge_pct:
    type: number
    description: "Battery state of charge (%). Compared against HC-008."
    minimum: 0.0
    maximum: 100.0

  available_energy_wh:
    type: number
    description: "Instantaneous available energy (Wh). Total capacity minus reserve."
    minimum: 0.0

  return_reserve_wh:
    type: number
    description: >
      Energy reserve allocated for return (Wh).
      Power Management module calculates and reports this field.
      Planner applies this value as HC-006 hard constraint.
      Planner never calculates the budget independently. Compliance Note 3.
    minimum: 0.0

  uncertainty_available_wh:
    type: number
    description: >
      Available energy estimate uncertainty (1σ, Wh).
      Used by planner in conservative margin calculation.
      Null not accepted; if unknown, marked as -1.
    not:
      type: "null"

  power_mode:
    type: string
    description: >
      Active power mode. Planner and FDIR behave according to this mode.
      full_operation: all systems active.
      science_restricted: science instruments restricted.
      traverse_only: traversal only, science disabled.
      survival: minimum power, critical systems only.
    enum:
      - full_operation
      - science_restricted
      - traverse_only
      - survival

  thermal_margin_c:
    type: number
    description: >
      Lowest thermal margin across critical components (°C).
      thermal_margin_c = min(T_limit_c[i] - T_current_c[i]) for i in {battery, main_computer, motor_drivers}.
      Compared against HC-007.

  heater_power_w:
    type: number
    description: "Total active heater power (W). Included in return reserve calculation."
    minimum: 0.0

  solar_panel_output_w:
    type: number
    description: "Instantaneous solar panel output (W). Used in safe_state charge calculation."
    minimum: 0.0

  estimated_range_reserve_m:
    type: number
    description: "Estimated range corresponding to return_reserve_wh (m). Provided by Navigation."
    minimum: 0.0

additionalProperties: false

example:
  schema_version: "1.0.0"
  timestamp_sclk: 812345678.0
  timestamp_utc: "2026-10-05T14:22:00Z"
  state_of_charge_pct: 72.3
  available_energy_wh: 185.0
  return_reserve_wh: 95.0
  uncertainty_available_wh: 8.5
  power_mode: "full_operation"
  thermal_margin_c: 12.4
  heater_power_w: 6.0
  solar_panel_output_w: 42.0
  estimated_range_reserve_m: 1200.0
