# status: draft
# owner: luna-ai-architecture
# depends_on: [interfaces/earth_visibility.schema.yaml, simulation/environment-model/]
# open_items: [5-site max limit determined by architectural decision — ground control UI capacity, longest_outage_hours aligned with SC-007]

# Multi-Site Comparison Schema
# Ground Control UI <-> Mission Intelligence <-> Environment Model contract (up to 5 sites)

$schema: "https://json-schema.org/draft/2020-12"
title: MultiSiteComparisonProduct
description: >
  Solar and Earth geometry comparison product for multiple landing candidate sites.
  Maximum 5 sites (LUNA-AI extension — repo supported 2–3 sites).
  Site finder weighted score is not included in this schema; ranking is the responsibility of mission intelligence.
  Final site selection requires GCA (operator approval) — aligned with B1-EK.

type: object
required:
  - comparison_time_utc
  - temporal_class
  - terrain_resolution
  - ephemeris_validity_range
  - sites

properties:
  comparison_time_utc:
    type: string
    format: date-time
    description: Comparison start time (ISO 8601)

  analysis_duration_days:
    type: number
    description: Analysis window (days); e.g. 7, 14, 30

  temporal_class:
    type: string
    enum: [historical, predicted]
    description: B5-EK §7.2 policy

  terrain_resolution:
    type: string
    enum: ["80m", "300m", "2700m"]
    description: >
      DEM resolution used in calculation. MANDATORY field — not hidden (DR-INT-004).
      Different sites may have been calculated at different resolutions; use site-level `site_resolution` override.

  ephemeris_validity_range:
    type: object
    description: Time range for which the calculation is valid. MANDATORY field (DR-INT-004, RR-012).
    required: [start_utc, end_utc]
    properties:
      start_utc:
        type: string
        format: date-time
      end_utc:
        type: string
        format: date-time

  sites:
    type: array
    minItems: 1
    maxItems: 5
    description: List of compared sites (max 5)
    items:
      type: object
      required:
        - site_id
        - sun_fraction
        - earth_fraction
        - longest_night_hours
        - longest_outage_hours
      properties:
        site_id:
          type: string

        site_name:
          type: string

        sun_fraction:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Solar illumination fraction over the analysis window

        earth_fraction:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Earth visibility fraction over the analysis window

        longest_night_hours:
          type: number
          minimum: 0
          description: Longest continuous dark period (hours) — thermal/energy budget input

        longest_outage_hours:
          type: number
          minimum: 0
          description: Longest Earth-invisible duration (hours) — SC-007 parameter

        site_resolution:
          type: string
          enum: ["80m", "300m", "2700m"]
          description: Site-specific DEM resolution (if different from global)

        observer_height_m:
          type: number
          minimum: 0
          description: Observer height used in calculation — aligned with SC-009

additionalProperties: false
